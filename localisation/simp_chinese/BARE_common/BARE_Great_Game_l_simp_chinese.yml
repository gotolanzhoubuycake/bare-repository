 Great_Game.1000.t: "学园战术演习开始！"
 Great_Game.1000.d: "随着学生会长失踪导致联邦学生会的行政能力大大减弱，学生会不得不将自己所拥有的部分地区的控制权转移给各大学园和凯撒集团，并让她们进行管辖。这个政策的成效显著，在减少了学生会的行政压力的同时，也大大促进了这些地区的繁荣与发展。\n\n然而，随着各个势力下属的自治区逐渐变多，各大势力之间的摩擦也愈发频繁——有学园因为边界地带划界而把官司闹到联邦学生会，有组织为了获取某个地区的经营权和控制权去伪造法律文书的，甚至还有几次升级为全面战争的案例。为了不让边界摩擦进一步影响基沃托斯的和平稳定，联邦学生会决定举办全基沃托斯范围的学园战术演习。在演习中，双方将围绕某块争议土地进行模拟战争，而胜利的一方则将被认可为这块土地的主人。\n\n目前，全基沃托斯的各大势力都已摩拳擦掌，准备在这场前所未有的“以武会友”中为自己争取更多的土地。至于这场战术演习到底会给基沃托斯的势力平衡带来何种影响，还需要进一步的观察。"
 Great_Game.1000.a: "加油！哦！"

 Great_Game.1.t: "[?Great_Game_invader.GetName]向我们发出战术演习挑战"
 Great_Game.1.d: "根据联邦学生会新的规定，[?Great_Game_invader.GetName]向我们发出了战术演习挑战，试图夺取[?Great_Game_invade_target.GetName]的托管权。准备作战。"
 Great_Game.1.a: "§Y30§!天后，§Y[?Great_Game_invader.GetName]§!向我们发动进攻，目标是夺取§Y[?Great_Game_invade_target.GetName]§!"


 Great_Game.2.t: "[FROM.GetName]希望我们一起参与演习"
 Great_Game.2.d: "[FROM.GetName]希望在即将到来的战术演习活动中和她们站在同一阵线，根据联邦学生会的归档，协助作战不会获得演习目标的托管权，但可以获得两倍的战术演习代币，我们有最多30天的准备时间。"
 Great_Game.2.a: "这次也请多指教了。"
 Great_Game.2.b: "不，这次不行。"


 Great_Game.3.t: "[FROM.GetName]接受了请求"
 Great_Game.3.d: "[FROM.GetName]接受了我们的邀请，如果没有突发事项，她们将在演习中与我们在同一阵线里。"
 Great_Game.3.a: "了解。"

 Great_Game.4.t: "[FROM.GetName]拒绝了请求"
 Great_Game.4.d: "[FROM.GetName]拒绝了我们的邀请，或许只能下次再叫上她们了。"
 Great_Game.4.a: "了解。"
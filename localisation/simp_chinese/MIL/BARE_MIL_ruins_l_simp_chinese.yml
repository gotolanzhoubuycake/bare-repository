 MIL_ruins_test_reset_attack: "重置当前废墟袭击"
 MIL_ruins_test_reset_attack_desc: "结束当前测试战争，清除敌军和应急边防部队，并将目标地块恢复为测试前的废墟所有权。"
 MIL_ruins_test_reset_attack_tt: "结束当前废墟袭击并恢复目标地块，使该地块可以再次测试"
 MIL_ruins_test_capitulation_fallback: "模拟千年投降兜底"
 MIL_ruins_test_capitulation_fallback_desc: "按千年在废墟袭击战争中停止抵抗的情况直接结算，用于检查敌人吞并、部队复员和核心地区建筑损坏。"
 MIL_ruins_test_capitulation_fallback_tt: "按千年停止抵抗结算：§G吞并当前袭击者并收回目标地块§!，随后使§R全部核心地区的建筑严重受损§!"

# 2026-07-18 修改：废墟第一阶段扩展调试入口。
 MIL_ruins_test_unlock_full_system: "测试：解锁废墟第一阶段"

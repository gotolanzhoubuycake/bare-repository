 MIL_ruins_test_story_chain: "测试：启动SPTF事件链"
 MIL_ruins_test_story_chain_desc: "从Hub被骇入开始执行完整的SPTF延时事件链。"
 MIL_ruins_test_analyze_current_enemy: "测试：分析当前敌人"
 MIL_ruins_test_analyze_current_enemy_desc: "立即完成当前废墟敌人的情报分析，缓解地区惩罚并显示真实身份。"
 MIL_ruins_test_apply_current_offensive: "测试：部署针对性攻势"

# 2026-08-03: 统一千年本地化键值为顶层格式，集中维护废墟系统调试与事件文本。
# 旧校区废墟袭击事件
 MIL_ruins_attack.643.t: "废弃住宅区 1-2-1 遭到袭击"
 MIL_ruins_attack.643.d: "工程队刚刚完成主要废墟的清理，潜伏在街区深处的武装力量便突然发动进攻，并迅速接管了废弃住宅区 1-2-1。安保部已在周边部署临时边防部队，为千年争取组织反击的时间。\n\n如果千年在这场战斗中停止抵抗，袭击者仍会被清除，目标地块也会被收回，但千年全部核心地区的建筑都将遭到严重破坏。"
 MIL_ruins_attack.641.t: "废弃住宅区 1-1-3 遭到袭击"
 MIL_ruins_attack.641.d: "工程队刚刚完成主要废墟的清理，潜伏在街区深处的武装力量便突然发动进攻，并迅速接管了废弃住宅区 1-1-3。安保部已在周边部署临时边防部队，为千年争取组织反击的时间。\n\n如果千年在这场战斗中停止抵抗，袭击者仍会被清除，目标地块也会被收回，但千年全部核心地区的建筑都将遭到严重破坏。"
 MIL_ruins_attack.640.t: "废弃城区 4-20-1 遭到袭击"
 MIL_ruins_attack.640.d: "工程队刚刚完成主要废墟的清理，潜伏在街区深处的武装力量便突然发动进攻，并迅速接管了废弃城区 4-20-1。安保部已在周边部署临时边防部队，为千年争取组织反击的时间。\n\n如果千年在这场战斗中停止抵抗，袭击者仍会被清除，目标地块也会被收回，但千年全部核心地区的建筑都将遭到严重破坏。"
 MIL_ruins_attack.639.t: "废弃城区 1-46-9 遭到袭击"
 MIL_ruins_attack.639.d: "工程队刚刚完成主要废墟的清理，潜伏在街区深处的武装力量便突然发动进攻，并迅速接管了废弃城区 1-46-9。安保部已在周边部署临时边防部队，为千年争取组织反击的时间。\n\n如果千年在这场战斗中停止抵抗，袭击者仍会被清除，目标地块也会被收回，但千年全部核心地区的建筑都将遭到严重破坏。"
 MIL_ruins_attack.response: "立即组织反击！"


 MIL_ruins_test_surprise_relic: "测试意外收获：旧遗物"
 MIL_ruins_test_surprise_relic_desc: "在废弃住宅区1-1-3直接触发一次旧遗物事件。"
 MIL_ruins_test_surprise_research: "测试意外收获：旧科研设施"

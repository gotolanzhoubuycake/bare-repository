 MIL_vol2_entry_unlocked_tt:0 "已开放手动国策“重新现身的莉音会长”。此时尚不开始调查期限；莉音抓走爱丽丝后才启动207天计时。"
 MIL_vol2_quick_strike_tt:0 "开始“突袭弱点，情报制胜”的7天计时。完成时增加1单位行动耗时，不新增受伤；现在不提前结算。"
 MIL_vol2_hidden_breakthrough_tt:0 "开始“突袭弱点，情报制胜”的7天计时。由于没有前卫君情报，完成时增加2单位行动耗时，营救名单内全部10人受伤90天。"
 MIL_vol2_start_eridu_tt:0 "开始“突入埃里都”的7天计时，不再重复结算前卫君战斗。"
 MIL_vol2_arrival_result_tt:0 "日鞠援助已生效：[GetMILVol2Aid]。不消耗政治点数、不另等3天。后续路线：[GetMILVol2EriduRoute]。"
 MIL_vol2_start_great_final_tt:0 "开始“友谊与勇气的赞歌”的7天计时，最终奖励在该国策完成时发放。"
 MIL_vol2_start_normal_final_tt:0 "开始“尘埃落定”的7天计时，最终奖励在该国策完成时发放。"
 MIL_vol2_start_failure_final_tt:0 "开始“无法挽回的结局”的7天计时。"
 MIL_vol2_exploit_weakness_effect_tt:0 "按道路、情报及所选战术一次结算前卫君战斗，触发“击破前卫君”；继续后开始“突入埃里都”。"
 MIL_vol2_enter_eridu_effect_tt:0 "触发“抵达埃里都”，免费获得日鞠援助：调查不小于80且拥有前卫君或埃里都情报时为全力援助，其余为普通援助。完成“措手不及的莉音”且累计耗时不超过2单位则开始“精准一击”，否则开始“与飞鸟马时的交战”。"
 MIL_vol2_toki_battle_effect_tt:0 "触发“激烈的交手”。累计耗时不超过5、获得全力援助、本次无伤、调查不小于40，任一满足则进入普通成功链，全部不满足则进入失败链。"
 MIL_vol2_precise_strike_effect_tt:0 "触发“闪电般的胜利”；继续后开始“友谊与勇气的赞歌”，不在此时提前领取结局奖励。"
 MIL_vol2_best_partners_effect_tt:0 "触发“离深渊只差一步”；继续后开始“尘埃落定”，不在此时提前领取结局奖励。"
 MIL_vol2_rio_last_stand_effect_tt:0 "触发“意料之外的防御”；继续后开始“无法挽回的结局”。"
 MIL_vol2_dust_settles_effect_tt:0 "触发“备受打击的莉音”，一次性发放普通成功奖励。\n$MIL_vol2_normal_result_tt$"
 MIL_vol2_irreversible_ending_effect_tt:0 "触发“不愿看见的结局”。\n$MIL_vol2_failure_result_tt$"
 MIL_vol2_friendship_and_courage_effect_tt:0 "触发“令人意外的新成员”，一次性发放大成功奖励。\n$MIL_vol2_great_result_tt$"

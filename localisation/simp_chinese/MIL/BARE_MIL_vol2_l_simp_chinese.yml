l_simp_chinese:
 MIL_vol2_returned_president:0 "重新现身的莉音会长"
 MIL_vol2_returned_president_desc:0 "时隔许久，莉音会长突然重新出现在研讨会的视野中，这是为了什么事情才重新现身呢？"
 MIL_vol2_dark_day:0 "黑暗的一天"
 MIL_vol2_dark_day_desc:0 "令我们没想到的是，会长的目标居然是爱丽丝，这让我们该如何是好？"
 MIL_vol2_seminar_decision:0 "研讨会的决定"
 MIL_vol2_seminar_decision_desc:0 "在激烈的心理挣扎之后，研讨会最终做出了决定，那便是全力营救爱丽丝，不论如何，即使会长有再多理由，也不应如此对待一名千年学生。"
 MIL_vol2_game_dev_resolve:0 "游戏开发部的决心"
 MIL_vol2_game_dev_resolve_desc:0 "虽然会长的理由很充分，可这绝不是游戏开发部放弃伙伴的理由，我们会竭尽全力，将伙伴从会长的手中解放出来！"
 MIL_vol2_authorize_veritas:0 "授权真理部"
 MIL_vol2_authorize_veritas_desc:0 "想要找人，定位是必不可少的，莉音会长即使能力再强也做不到掩盖自己的一切痕迹，那么，真理部的能力便可以派上用场了。"
 MIL_vol2_alice_friends:0 "爱丽丝的朋友们"
 MIL_vol2_alice_friends_desc:0 "只靠几个社团是远远不够的，爱丽丝是千年所有人的朋友，人心齐，泰山移，尽可能的发动每一份力量，我们才能更快的找回爱丽丝。"
 MIL_vol2_engineering_help:0 "工程师部的协助"
 MIL_vol2_engineering_help_desc:0 "莉音会长再厉害，她使用的器械也不可能完全靠自己生产，那么，工程师部手中一定有关于莉音会长的线索，我们需要工程师部的帮助，来分析会长可能的防御布置。"
 MIL_vol2_rescue_start:0 "拯救爱丽丝的起点"
 MIL_vol2_rescue_start_desc:0 "终于，我们完成了准备工作，现在，是时候踏上路途，去拯救我们最好的朋友了。"
 MIL_vol2_find_road:0 "寻找道路"
 MIL_vol2_find_road_desc:0 "决定出发后，我们碰见了第一个问题：“该怎么过去？”废墟之中的道路我们并不能全部掌握，必须得尽快找到正确的道路才行。"
 MIL_vol2_auto_find_road:0 "自动国策：寻找道路"
 MIL_vol2_auto_find_road_desc:0 "7天计时结束后完成对应国策。事件需要作出选择时，后续计时在选择后启动。"
 MIL_vol2_station:0 "废弃的车站"
 MIL_vol2_station_desc:0 "幸运的是，我们找到了一座车站，这里似乎可以通往埃里都。"
 MIL_vol2_auto_station:0 "自动国策：废弃的车站"
 MIL_vol2_auto_station_desc:0 "7天计时结束后完成对应国策。事件需要作出选择时，后续计时在选择后启动。"
 MIL_vol2_ruins_road:0 "废墟中的道路"
 MIL_vol2_ruins_road_desc:0 "由于准备不够充分，我们只得选择一条看上去可行的道路，希望运气站在我们这一边。"
 MIL_vol2_auto_ruins_road:0 "自动国策：废墟中的道路"
 MIL_vol2_auto_ruins_road_desc:0 "7天计时结束后完成对应国策。事件需要作出选择时，后续计时在选择后启动。"
 MIL_vol2_surprise:0 "奇袭制胜"
 MIL_vol2_surprise_desc:0 "通过完善的侦察，我们找出了一条合适且隐蔽的道路，会长一定想不到我们的行动的。"
 MIL_vol2_auto_surprise:0 "自动国策：奇袭制胜"
 MIL_vol2_auto_surprise_desc:0 "7天计时结束后完成对应国策。事件需要作出选择时，后续计时在选择后启动。"
 MIL_vol2_vanguard:0 "实力强劲的“前卫君”"
 MIL_vol2_vanguard_desc:0 "在前进路上，我们碰见了糟糕的事情，莉音会长发现了我们的行动，并派出了一台名为“前卫君”的战斗机器人阻挡我们，虽然会长的审美确实有点一言难尽，但是其本身却相当难以对付，我们必须尽快解决“前卫君”，才能继续前进。"
 MIL_vol2_auto_vanguard:0 "自动国策：实力强劲的“前卫君”"
 MIL_vol2_auto_vanguard_desc:0 "7天计时结束后完成对应国策。事件需要作出选择时，后续计时在选择后启动。"
 MIL_vol2_rio_surprised:0 "措手不及的莉音"
 MIL_vol2_rio_surprised_desc:0 "莉音会长对我们的行动完全没有察觉，我们成功地打了她一个出其不意，接下来就该乘胜追击了。"
 MIL_vol2_auto_rio_surprised:0 "自动国策：措手不及的莉音"
 MIL_vol2_auto_rio_surprised_desc:0 "7天计时结束后完成对应国策。事件需要作出选择时，后续计时在选择后启动。"
 MIL_vol2_hard_battle:0 "与“前卫君”的苦战"
 MIL_vol2_hard_battle_desc:0 "“前卫君”出乎预料的强大，这让我们陷入了一场恶战，情况已经不容许我们重新再来，只能强行从正面突破了。"
 MIL_vol2_auto_hard_battle:0 "自动国策：与“前卫君”的苦战"
 MIL_vol2_auto_hard_battle_desc:0 "7天计时结束后完成对应国策。事件需要作出选择时，后续计时在选择后启动。"
 MIL_vol2_exploit_weakness:0 "突袭弱点，情报制胜"
 MIL_vol2_exploit_weakness_desc:0 "由于我们事先进行了较为充分的准备，莉音会长完全没料到我们已经掌握了足够的情报，因此，我们得以利用情报优势重创了前卫君，接下来的事情就很容易完成了。"
 MIL_vol2_enter_eridu:0 "突入埃里都"
 MIL_vol2_enter_eridu_desc:0 "在击破前卫君后，我们终于顺利抵达埃里都这个要塞城市，现在，是时候去跟莉音会长好好痛陈利害了。"
 MIL_vol2_toki_battle:0 "与飞鸟马时的交战"
 MIL_vol2_toki_battle_desc:0 "我们没想到莉音会长居然还留有后手，真是该死，我们必须尽快击破时的阻拦，找到莉音会长和爱丽丝。"
 MIL_vol2_precise_strike:0 "精准一击"
 MIL_vol2_precise_strike_desc:0 "正所谓兵贵神速，我们的行动取得了极大的成功，莉音会长甚至来不及部署更多防御便被我们击破了埃里都的城防，这精确的一击已经宣告了我们的胜利。"
 MIL_vol2_best_partners:0 "勇者最好的伙伴们"
 MIL_vol2_best_partners_desc:0 "真是不幸中的万幸，我们最终还是在一切都太晚之前赶到了爱丽丝的身边，一切都已经结束了，勇者最终还是等来了她最好的伙伴。"
 MIL_vol2_rio_last_stand:0 "莉音的最后挣扎"
 MIL_vol2_rio_last_stand_desc:0 "我们被拖延得太久了，以至于莉音会长居然再次启动了一个连时都不知道的最终防御程序，我们只能听天由命，希望爱丽丝还在等待着我们。"
 MIL_vol2_dust_settles:0 "尘埃落定"
 MIL_vol2_dust_settles_desc:0 "当爱丽丝叫停了key的行动之后，一切都已经尘埃落定，毫无疑问，这是属于千年学生们的胜利，营救行动虽一波三折但还是取得了成功。"
 MIL_vol2_irreversible_ending:0 "无法挽回的结局"
 MIL_vol2_irreversible_ending_desc:0 "一切都太迟了，由于种种原因，我们还是晚了一步，莉音会长为了阻止坏结局做出的预防行为最终促成了最坏结局的出现，我们已经无能为力，只能忍受着巨大的悲痛，吞下我们自己造成的苦果。"
 MIL_vol2_friendship_and_courage:0 "友谊与勇气的赞歌"
 MIL_vol2_friendship_and_courage_desc:0 "这是一场教科书般的胜利，在全体千年学生的配合之下，整场行动的执行堪称完美，所有人用自己共同的努力，谱写了一曲只属于千年学生们自己的，友谊与勇气的赞歌。"
 MIL_vol2_category:0 "营救爱丽丝"
 MIL_vol2_category_desc:0 "当前阶段：[GetMILVol2Phase]\n调查进度：§Y[?MIL_vol2_progress|0]/100§!\n网络定位：§Y[?MIL_vol2_signal_round|0]/3§!\n行动耗时：§Y[?MIL_vol2_action_time|0]单位§!\n本次行动受伤人数：§Y[?MIL_vol2_injured_count|0]§!\n援助等级：§Y[?MIL_vol2_aid_level|0]§!（0：未获得；1：普通；2：全力）"
 MIL_vol2_overview:0 "营救行动记录"
 MIL_vol2_overview_desc:0 "[GetMILVol2Phase]\n调查进度封顶100。行动耗时只由道路与战斗结果累计，不随日历或国策数量增长。\n定位结果：[GetMILVol2Location]\n前卫君情报：[GetMILVol2VanguardIntel]\n学生动员：[GetMILVol2Mobilization]"
 MIL_vol2_phase_preparation:0 "等待调查阶段"
 MIL_vol2_phase_investigation:0 "调查阶段"
 MIL_vol2_phase_action:0 "行动阶段"
 MIL_vol2_phase_finished:0 "终局已结算"
 MIL_vol2_location_trusted:0 "已信任重要定位，定位调查已结束"
 MIL_vol2_location_eridu:0 "已获得埃里都线索，定位调查已结束"
 MIL_vol2_location_pending:0 "等待决定是否信任重要定位"
 MIL_vol2_location_other:0 "未锁定定位路线"
 MIL_vol2_yes:0 "已获得"
 MIL_vol2_no:0 "未获得"
 MIL_vol2_departure_deadline:0 "出发的最后期限"
 MIL_vol2_departure_deadline_desc:0 "从莉音抓走爱丽丝开始计时207天。到期仍未出发则强制出发，终止本线未完成的手动国策与调查；退还进行中调查的实付政治点数，不发放未完成效果。"
 MIL_vol2_inquire:0 "调查爱丽丝的去向"
 MIL_vol2_inquire_desc:0 "支付10政治点数，执行15天；完成后获得10调查进度，学生动员生效后额外获得10。完成后冷却5天。\n当前调查进度：§Y[?MIL_vol2_progress|0]/100§!"
 MIL_vol2_locate_signal:0 "网络信号定位"
 MIL_vol2_locate_signal_desc:0 "每轮15政治点数、15天，最多3轮，同一时间只能执行一轮；完成并处理结果后可再次开始。\n模糊定位/重要定位/埃里都线索的概率：\n未动员：60%/20%/20%、20%/40%/40%、0%/40%/60%。\n已动员：56.25%/18.75%/25%、16.67%/33.33%/50%、0%/25%/75%（实际按精确比例抽取）。\n获得埃里都线索或信任重要定位后停止。"
 MIL_vol2_mobilize:0 "动员千年的学生们"
 MIL_vol2_mobilize_desc:0 "支付50政治点数，执行3天，仅可完成一次。完成后本次调查阶段持续生效：基础调查额外获得10线索；提高三轮定位的埃里都线索概率；订单追加轮额外获得15个百分点成功率，首次不加成。"
 MIL_vol2_order:0 "来源不明的零件订单"
 MIL_vol2_order_desc:0 "首次花费50政治点数，执行7天，首次成功率固定25%。未成功则完成后共享冷却3天，由事件选择是否追加；每次追加费用增加5，成功率增加10个百分点。动员仅对追加轮额外提高15个百分点，成功率封顶100%。\n下一轮费用：§Y[?MIL_vol2_order_cost|0]§!政治点数；成功率：§Y[?MIL_vol2_order_chance|0]%§!。成功后结束订单调查。"
 MIL_vol2_order_timer:0 "追查零件订单"
 MIL_vol2_order_timer_desc:0 "本轮已支付：§Y[?MIL_vol2_order_paid|0]§!政治点数。\n本轮成功率：§Y[?MIL_vol2_order_current_chance|0]%§!。\n7天结束后抽取；失败后冷却3天再询问追加。取消未完成轮次时只退本轮实付费用。"
 MIL_vol2_order_cost_text:0 "£pol_power [?MIL_vol2_order_cost|0]"
 MIL_vol2_depart:0 "前往埃里都"
 MIL_vol2_depart_desc:0 "免费、一次性。点击后立即出发，并开始“寻找道路”的7天自动计时。"
 MIL_vol2_lock_refund_tt:0 "§Y锁定全部Vol.2调查决议§!，立即终止正在进行的调查，退还这些任务已支付的政治点数。未完成效果不结算，已完成的成果保留、费用不退还。开放“前往埃里都”；调查不会在等待出发期间恢复。"
 MIL_vol2_deadline_tt:0 "开放营救爱丽丝决议组，并从现在起计时§Y207天§!；届时仍未出发则强制出发。"
 MIL_vol2_forced_departure_tt:0 "已强制出发。本线未完成手动国策不能再研究，不补完、不发奖励；调查已终止并退还未完成轮次的实付费用。“寻找道路”开始7天计时。"
 MIL_vol2_inquire_start_tt:0 "15天后获得10调查进度；届时动员已生效则额外获得10。完成后冷却5天，进度上限100。"
 MIL_vol2_locate_signal_start_tt:0 "15天后结算本轮定位；等待“重要定位”选择时不可启动下一轮。"
 MIL_vol2_mobilize_start_tt:0 "3天后学生动员在本次调查阶段持续生效；不会在3天后失效。"
 MIL_vol2_order_start_tt:0 "支付§Y[?MIL_vol2_order_cost|0]§!政治点数，开始7天追查；本轮成功率§Y[?MIL_vol2_order_chance|0]%§!。成功后不再追加，失败后从完成起冷却3天。"
 MIL_vol2_trust_tt:0 "信任此定位后，网络定位调查将锁定；前往埃里都时会走迷路路线，即使调查进度达到100也不会改走隐蔽路线。"
 MIL_vol2_eridu_intel_tt:0 "已获得埃里都定位信息，网络定位不再可用。此情报不直接增加调查进度。"
 MIL_vol2_vanguard_intel_tt:0 "已获得前卫君的重要情报，订单调查结束，不再扣费或追加。"
 MIL_vol2_station_result_tt:0 "本次道路增加§Y2单位§!行动耗时，并被莉音发现。继续后开始“实力强劲的前卫君”的7天计时。"
 MIL_vol2_ruins_road_result_tt:0 "本次道路增加§Y3单位§!行动耗时，并被莉音发现。继续后开始“实力强劲的前卫君”的7天计时。"
 MIL_vol2_surprise_result_tt:0 "本次道路增加§Y1单位§!行动耗时，未被发现。继续后开始“措手不及的莉音”的7天计时；后续仍需在“突袭弱点，情报制胜”中结算前卫君战斗。"
 MIL_vol2_breakthrough_tt:0 "开始7天自动国策，完成时才结算战斗。\n无情报进入“与前卫君的苦战”：调查不足40时耗时4单位、随机4人受伤；40至59时耗时3单位、全部10人受伤；不小于60时耗时2单位、全部10人受伤。\n有情报进入“突袭弱点，情报制胜”：耗时1单位、随机5人受伤。受伤持续90天，本次受伤记录不会随恢复清除。"
 MIL_vol2_weakness_tt:0 "调查不小于60才能选择。开始“突袭弱点，情报制胜”的7天计时，完成时无情报耗时3单位、有情报耗时2单位，不新增受伤。点击选项时不提前结算。"
 MIL_vol2_hard_battle_result_tt:0 "本次战斗结果已结算。当前累计耗时：§Y[?MIL_vol2_action_time|0]单位§!；本次行动受伤人数：§Y[?MIL_vol2_injured_count|0]§!。负伤持续90天。"
 MIL_vol2_final_assault_tt:0 "耗时不超过5、全力援助、本次未造成受伤、调查不小于40，任一满足则开始“勇者最好的伙伴们”，全部不满足则开始“莉音的最后挣扎”。不增加耗时或伤员，也不提前发放结局奖励；此处不能改入精准一击路线。"
 MIL_vol2_final_split_tt:0 "$MIL_vol2_final_assault_tt$"
 MIL_vol2_great_result_tt:0 "恢复爱丽丝、莉音当前已有身份；获得365天“闪电般的胜利”（政治点数获取、稳定度、战争支持度各+15%）。现有将领获得全属性+1。641、643建造速度+50%、最大工厂槽位+40%。\n§Y地区工厂产出+30%及缺失角色身份尚未实现；原废墟减益处理与工业线衔接继续搁置。§!"
 MIL_vol2_normal_result_tt:0 "恢复爱丽丝已有身份；获得365天“惊险的成功”（稳定度+10%）。641、643建造速度+25%、最大工厂槽位+20%。\n§Y地区工厂产出+15%尚未实现；原废墟减益处理与工业线衔接继续搁置。§!"
 MIL_vol2_failure_result_tt:0 "记录营救失败，不添加“被完全破坏的城市”地区修正，也不清除原有废墟减益。内战、战后国家负面精神及将领创伤另行处理，本阶段不提前触发。"
 MIL_vol2_missing_roles_tt:0 "当前只恢复角色文件中已经定义的身份。Key尚无角色定义；莉音尚无内阁及将领身份，留待补齐，不凭空生成角色属性。"
 MIL_vol2_automatic_only_tt:0 "由营救行动自动计时推进，不能手动研究。"
 MIL_vol2_investigation_open_tt:0 "调查阶段尚未结束"
 MIL_vol2_inquiry_ready_tt:0 "本轮调查已完成，且完成后的5天冷却已经结束"
 MIL_vol2_signal_ready_tt:0 "没有执行中的定位或待处理选择，且未达到次数上限或取得锁定结果"
 MIL_vol2_order_ready_tt:0 "订单未结束，且没有执行中任务或完成后的3天共享冷却"
 MIL_vol2_mobilize_ready_tt:0 "尚未动员学生，且没有执行中的动员"
 MIL_vol2_lightning_victory:0 "闪电般的胜利"
 MIL_vol2_lightning_victory_desc:0 ""
 MIL_vol2_narrow_success:0 "惊险的成功"
 MIL_vol2_narrow_success_desc:0 ""
 MIL_vol2_inspiring_success:0 "令人振奋的成功"
 MIL_vol2_inspiring_success_desc:0 "成功的营救使将领们受到鼓舞。"
 MIL_vol2_preserved_city_normal:0 "保存完好的城市"
 MIL_vol2_preserved_city_great:0 "保存完好的城市"
 MIL_vol2_debug_category:0 "Vol.2机制调试"
 MIL_vol2_debug_category_desc:0 "仅用于开发验收，不属于正式剧情入口。开放国策与援助测试不会在非调试模式出现。"
 MIL_vol2_debug_unlock:0 "调试：开放Vol.2国策"
 MIL_vol2_debug_unlock_desc:0 "仅调试模式可用。只开放主线，不完成国策，不触发抓人。正式流程在完成“千年发展的新蓝图”365天后开放。"
 MIL_vol2_debug_full_aid:0 "调试：设为全力援助"
 MIL_vol2_debug_full_aid_desc:0 "只用于抵达埃里都后的结局分支测试。正式援助在“突入埃里都”完成时按调查与情报分档。"
 MIL_vol2_find_road_effect_tt:0 "7天结束后，按调查值及是否信任重要定位自动选择下一条道路国策。"
 MIL_vol2_station_effect_tt:0 "触发“乘坐电车”：耗时+2单位、行动暴露。"
 MIL_vol2_ruins_road_effect_tt:0 "触发“迷路”：耗时+3单位、行动暴露。"
 MIL_vol2_surprise_effect_tt:0 "触发“通路”：耗时+1单位、不暴露，随后进入“措手不及的莉音”；后续仍结算前卫君战斗。"
 MIL_vol2_vanguard_effect_tt:0 "触发“遭遇前卫君”，按调查与情报提供应对选项。"
 MIL_vol2_rio_surprised_effect_tt:0 "触发“措手不及的莉音”。有前卫君情报时快速击破，无情报时选择强攻或寻找弱点；均进入“突袭弱点，情报制胜”，在其完成时结算战斗。"
 MIL_vol2_hard_battle_effect_tt:0 "按无情报强攻档位结算耗时与负伤，再触发“苦战得脱”，继续后开始“突入埃里都”。"

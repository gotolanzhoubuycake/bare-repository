 # 国策条件与效果提示
 MIL_new_development_plan_financial_stability_tt: "§Y财政危机§!至少达到§Y稳定侧80%§!"
 MIL_new_development_plan_bop_tooltip: "移除§Y财政危机§!，并从中间位置建立§Y发展资源调度§!权力平衡"
 MIL_Upgrade_Imaginary_numbers_count_tt: "至少完成§Y2§!次“虚数”优化（当前：[?MIL_award_imaginary_number_network_completed|Y0]次）"
 MIL_Expand_Eridu_rebuilt_tt: "§Y千年南湖技术园§!已完成重建，并由千年拥有和控制"
 MIL_Expand_Eridu_effect_tt: "在§Y千年南湖技术园§!增加§G2§!座民用工厂、§G1§!座重工厂和§G3§!个建筑槽。\n\n开启§Y埃里都工厂转化§!：\n仅在千年控制§Y千年南湖技术园§!时累计时间；每累计§Y90§!个控制日检查一次。若当地同时拥有民用工厂、军用工厂和重工厂，将随机永久拆除其中一类工厂§R1§!座，并增加§G1§!座同类型地图外工厂。\n若检查时工厂条件不足，本轮不会转化，并重新累计下一轮90个控制日。失去当地控制权时停止累计，重新控制后从原有进度继续。"
 MIL_Ruin_development_all_ruins_started_tt: "四个旧校区废墟地块均已完成§Y初步开发§!，正式加入废墟开发计划"
 MIL_Ruin_development_research_unlock_tt: "解锁§Y科研设施建设§!决议。正式建设最多完成§Y3§!次，每次完成后进入§Y90§!天冷却。\n\n§Y普通建设§!占用§Y20§!座民用工厂，三次工期依次为§Y60§!、§Y75§!和§Y90§!天。拥有优惠时改为占用§Y10§!座民用工厂，工期依次缩短为§Y30§!、§Y38§!和§Y45§!天。\n\n每次建设完成后，将从尚未建设科研设施、已经重建且由千年拥有和控制的废墟地块中确定地点，再由千年选择设施类型。重型器械、精密器械和神秘工业设施在正式建设中各限§Y1§!座，每个废墟地块最多拥有§Y1§!座科研设施。"
 MIL_Clear_more_debris_areas_three_states_tt: "至少§Y3§!个废墟地块完成第三阶段重建"
 MIL_Clear_more_debris_areas_effect_tt: "在§Y3§!个不同的已重建废墟地块各增加§G1§!座民用工厂和§G1§!个建筑槽，并沿南北干线修建§Y5级铁路§!"
 MIL_Tower_mid_term_Project_thresholds_tt: "完成§Y3§!次虚数优化、§Y2§!次科研设施建设、§Y5§!次工业设施建设和§Y1§!次设备更新\n当前：虚数§Y[?MIL_award_imaginary_number_network_completed|0]§!；科研§Y[?MIL_phase_2_research_facilities_completed|0]§!；工业§Y[?MIL_phase_2_industrial_facilities_completed|0]§!；设备§Y[?MIL_phase_2_equipment_updates_completed|0]§!"
 MIL_more_research_equipment_count_tt: "至少完成§Y4§!次“虚数”优化（当前：[?MIL_award_imaginary_number_network_completed|Y0]次）"
 MIL_more_research_equipment_fallback_tt: "没有可建设科研设施的废墟地块：改为在一个已重建地块增加§G2§!座民用工厂和§G2§!个建筑槽"
 MIL_better_Experimental_environment_thresholds_tt: "完成§Y3§!次科研设施建设、§Y7§!次工业设施建设和§Y2§!次设备更新\n当前：科研§Y[?MIL_phase_2_research_facilities_completed|0]§!；工业§Y[?MIL_phase_2_industrial_facilities_completed|0]§!；设备§Y[?MIL_phase_2_equipment_updates_completed|0]§!"
 MIL_clean_not_destory_bypass_tt: "已完成全部§Y3§!次正式科研设施建设，该国策将自动跳过"
 MIL_clean_not_destory_discount_tt: "获得§G2§!次§Y科研设施建设优惠§!。每次启动科研设施建设时消耗§Y1§!次优惠，将占用的民用工厂从§Y20§!座减少到§Y10§!座，并将三次建设的工期从§Y60§!/§Y75§!/§Y90§!天缩短为§Y30§!/§Y38§!/§Y45§!天。\n\n只有四个固定科研设施落点都已经建有科研设施、无法继续建设时，剩余优惠才会逐次折算。每折算§Y1§!次优惠，随机一个废墟地块获得§G1§!座民用工厂和§G1§!个建筑槽。"

 # 虚数循环
 MIL_Imaginary_System_Upgrade: "持续优化的“虚数”系统"
 MIL_Imaginary_System_Upgrade_desc: "“虚数”会持续进行长期优化。每轮优化永久提高科研速度和特殊项目速度，并使下一轮所需时间增加30天。"
 MIL_award_imaginary_number_network_new_invention_desc: "“虚数”正在执行新一轮系统优化。完成后将永久提高科研速度和特殊项目速度，后续每轮所需时间增加30天。\n\n已完成优化：§Y[?MIL_award_imaginary_number_network_completed|0]§!次"
 MIL_award_imaginary_number_network_result_tt: "本轮优化完成：科研速度和特殊项目速度将同时获得一档永久提升，并自动开始延长30天的下一轮优化"

 # 第二阶段正式决议
 MIL_phase_2_build_civilian_facilities: "建设民用设施"
 MIL_phase_2_build_civilian_facilities_desc: "占用§Y5§!座民用工厂。完成后在一个随机的已重建且由千年控制的废墟地块增加§G1§!座民用工厂和§G1§!个建筑槽。初始工期45天，每完成一次，下次工期增加5天；完成后冷却30天。"
 MIL_phase_2_build_civilian_facilities_effect_tt: "随机一个合格废墟地块获得§G1§!座民用工厂和§G1§!个建筑槽；民用设施和工业设施建设次数各增加§G1§!，下次工期增加§Y5§!天"
 MIL_phase_2_build_weapons_facilities: "建设武器设施"
 MIL_phase_2_build_weapons_facilities_desc: "占用§Y3§!座民用工厂。完成后在一个随机的已重建且由千年控制的废墟地块增加§G1§!座军用工厂和§G1§!个建筑槽。初始工期45天，每完成一次，下次工期增加5天；完成后冷却30天。"
 MIL_phase_2_build_weapons_facilities_effect_tt: "随机一个合格废墟地块获得§G1§!座军用工厂和§G1§!个建筑槽；武器设施和工业设施建设次数各增加§G1§!，下次工期增加§Y5§!天"
 MIL_phase_2_research_facility_discount_1: "建设科研设施（优惠，第一次）"
 MIL_phase_2_research_facility_discount_1_desc: "占用§Y10§!座民用工厂，持续§Y30§!天。完成后从随机可用地块中选择建设重型器械、精密器械或神秘工业设施。"
 MIL_phase_2_research_facility_discount_2: "建设科研设施（优惠，第二次）"
 MIL_phase_2_research_facility_discount_2_desc: "占用§Y10§!座民用工厂，持续§Y38§!天。完成后从随机可用地块中选择建设重型器械、精密器械或神秘工业设施。"
 MIL_phase_2_research_facility_discount_3: "建设科研设施（优惠，第三次）"
 MIL_phase_2_research_facility_discount_3_desc: "占用§Y10§!座民用工厂，持续§Y45§!天。完成后从随机可用地块中选择建设重型器械、精密器械或神秘工业设施。"
 MIL_phase_2_research_facility_normal_1: "建设科研设施（第一次）"
 MIL_phase_2_research_facility_normal_1_desc: "占用§Y20§!座民用工厂，持续§Y60§!天。完成后从随机可用地块中选择建设重型器械、精密器械或神秘工业设施。"
 MIL_phase_2_research_facility_normal_2: "建设科研设施（第二次）"
 MIL_phase_2_research_facility_normal_2_desc: "占用§Y20§!座民用工厂，持续§Y75§!天。完成后从随机可用地块中选择建设重型器械、精密器械或神秘工业设施。"
 MIL_phase_2_research_facility_normal_3: "建设科研设施（第三次）"
 MIL_phase_2_research_facility_normal_3_desc: "占用§Y20§!座民用工厂，持续§Y90§!天。完成后从随机可用地块中选择建设重型器械、精密器械或神秘工业设施。"
 MIL_phase_2_research_facility_complete_tt: "科研设施建设次数增加§G1§!，随后在随机合格地块选择一类尚未正式建设过的科研设施；完成后进入§Y90§!天冷却"
 MIL_phase_2_update_local_equipment: "更新当地设备"
 MIL_phase_2_update_local_equipment_desc: "永久拆除目标地块§R1§!座民用工厂，持续§Y30§!天。完成后该地块永久记录“设备上新”，但只有千年控制当地时提供建设效果。每个废墟地块只能执行一次。"
 MIL_phase_2_update_local_equipment_effect_tt: "目标地块永久拆除§R1§!座民用工厂并获得§Y设备上新§!；设备更新次数增加§G1§!"

 # 科研设施事件
 MIL_industrial_phase_2.1.t: "新科研设施的用途"
 MIL_industrial_phase_2.1.d: "施工地点已经确定，配套管线与安全区也完成了初步划分。现在需要决定这座设施今后承担哪一类研究工作。正式建设中，每一种设施类型只能选择一次。"
 MIL_industrial_phase_2.1.land: "建设重型器械设施"
 MIL_industrial_phase_2.1.land_tt: "在已经确定的地块固定落点建设§Y重型器械设施§!；正式建设中不能再次选择该类型"
 MIL_industrial_phase_2.1.air: "建设精密器械设施"
 MIL_industrial_phase_2.1.air_tt: "在已经确定的地块固定落点建设§Y精密器械设施§!；正式建设中不能再次选择该类型"
 MIL_industrial_phase_2.1.batech: "建设神秘工业设施"
 MIL_industrial_phase_2.1.batech_tt: "在已经确定的地块固定落点建设§Y神秘工业设施§!；正式建设中不能再次选择该类型"
 MIL_industrial_phase_2.2.t: "巨塔配套科研设施"
 MIL_industrial_phase_2.2.d: "巨塔工程调拨出一套完整科研设施。我们可以在剩余的废墟开发地块直接建设，并按当前最需要的方向配置设备。这座免费设施不计入常规科研设施建设次数。"
 MIL_industrial_phase_2.2.land: "配置为重型器械设施"
 MIL_industrial_phase_2.2.land_tt: "在已经确定的地块免费建设§Y重型器械设施§!，不增加正式科研设施建设次数"
 MIL_industrial_phase_2.2.air: "配置为精密器械设施"
 MIL_industrial_phase_2.2.air_tt: "在已经确定的地块免费建设§Y精密器械设施§!，不增加正式科研设施建设次数"
 MIL_industrial_phase_2.2.batech: "配置为神秘工业设施"
 MIL_industrial_phase_2.2.batech_tt: "在已经确定的地块免费建设§Y神秘工业设施§!，不增加正式科研设施建设次数"
 MIL_industrial_phase_2.3.t: "研讨会的新预算"
 MIL_industrial_phase_2.3.d: "财政危机结束后，研讨会终于可以把预算从被动填补缺口转向长期建设。新的预算表已经通过，接下来要做的，是把这些数字变成真正的新设施。"
 MIL_industrial_phase_2.3.a: "批准新预算"
 MIL_industrial_phase_2.4.t: "欢庆时刻"
 MIL_industrial_phase_2.4.d: "第二座千年巨塔正式完成。参与工程的学生汇聚在塔下，等待灯光逐层亮起。这一刻属于每一位为千年未来付出努力的人。"
 MIL_industrial_phase_2.4.a: "这是属于千年的成果"


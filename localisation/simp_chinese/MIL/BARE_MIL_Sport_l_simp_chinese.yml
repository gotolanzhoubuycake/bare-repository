MIL_Sport_Improve_Millennium_Infrastructure: "改善学园基础设施"
MIL_Sport_Improve_Millennium_Infrastructure_desc: "晄轮大祭不仅是一场大运动会，实际上也是一场大型的学园交流会，基础设施不仅有助于大运动会的正常开展，也有助于提升学园的形象，因此，对学园周边基础设施进行建设有助于晄轮大祭的开展，也能提升晄轮大祭的支持度。"
MIL_Sport_Improve_Millennium_Infrastructure_tooltip: "准备综合评分：§G+10§!\n学生支持度：§G+5%§!"

MIL_Sport_Constructing_Sports_Venues: "修建运动会场地"
MIL_Sport_Constructing_Sports_Venues_desc: "毫无疑问，运动会要有专业的场地才能开展，尽管学园已经有了一些基础的场地，但对于晄轮大祭而言还是远远不够，运动会场地的修建程度将直接决定运动会的效果，所以尽管花费高昂，但请尽可能完成对运动会场地的建设。这些场地在之后也有助于学园的体育活动，因此能赢得学生的支持。"
BARE_MIL_sport_Building_Score_Max_Level_tooltip: "最多建设5级场地([?BARE_MIL_sport_Building_Score_Var]/5)"

MIL_Sport_Constructing_Sports_Venues_tooltip: "准备综合评分：§G+[?MIL_Sport_Constructing_Sports_Venues_Score_Add_Temp]%§!\n学生支持度：§G+5%§!\n场地准备程度：§G+1§!"
MIL_Sport_Landmark_Main_Stadium: "建设地标级主要大型运动场"
MIL_Sport_Landmark_Main_Stadium_desc: "趁着筹备资金还没有被日常开销分散，研讨会可以提前拍板建设一座足以成为晄轮大祭象征的主运动场。这样做会占用巨额预算，也需要漫长工期，但一旦完工，它将立刻改善会场条件并留下长期资产。"
MIL_Sport_Landmark_Main_Stadium_condition_tt: "需要处于§Y筹备前6个月§!，且场地准备程度不能超过§Y3§!级。"
MIL_Sport_Landmark_Main_Stadium_tt: "准备综合评分：§G+20§!\n学生支持度：§G+10%§!\n随机一个受控制地区：§G+3§!民用工厂\n场地准备程度：§G+1§!\n§L不会提高普通§Y修建运动会场地§!决议的下一次经费消耗。§!"

MIL_Sport_Crackdown_on_Sabotage: "严厉打击混混和破坏分子"
MIL_Sport_Crackdown_on_Sabotage_desc: "我们已经确认已经有许多不怀好意的眼神看向了晄轮大祭，她们可能有着各种各样的目的，但她们最终的结果都会是毁掉晄轮大祭。通过调度额外的经费，我们可以让C&C先发制人，从而减少破坏的效果。不过，每次出击后，C&C需要额外的经费和一定的时间才能继续行动。"
MIL_Sport_Crackdown_on_Sabotage_tooltip: "§Y降低一次破坏事件的破坏程度§!"

# 2026-05-21: 晄轮大祭新增调度决议
MIL_Sport_Establish_Savings_Fund: "建立储蓄资金"
MIL_Sport_Establish_Savings_Fund_desc: "把一部分前期预算从普通账目中单独划出，可以避免它们在月度结算时被经费上限吞没。之后研讨会可以分批动用这笔储备，处理高额建设窗口。"
MIL_Sport_Establish_Savings_Fund_tt: "解锁决议§Y动用储备资金§!。\n可动用次数：§G3§!次"
MIL_Sport_Use_Reserve_Fund: "动用储备资金"
MIL_Sport_Use_Reserve_Fund_desc: "从此前设立的储蓄资金中调取一笔预算，临时补充晄轮大祭当前可用经费。"
MIL_Sport_Use_Reserve_Fund_condition_tt: "剩余可动用次数需要大于§Y0§!。"
MIL_Sport_Use_Reserve_Fund_tt: "当前可用经费：§G+10§!\n剩余可动用次数：§R-1§!\n这笔临时经费可以让当前经费短期超过上限；下个月月度更新时仍会按当前经费上限刷新。"
MIL_Sport_Expand_Executive_Committee: "扩展晄轮大祭执行委员会职能"
MIL_Sport_Expand_Executive_Committee_desc: "如果晄轮大祭已经成为千禧的长期重点项目，那么临时协调小组显然不够。扩展执行委员会职能、建立常设分工和问责机制，可以让学生们看到准备工作确实在被认真推进。"
MIL_Sport_Expand_Executive_Committee_tt: "学生支持度每月变化：§G+2§!\n学生支持度：§G+5%§!\n准备综合评分：§G+10§!"
MIL_Sport_Connect_Imaginary_Automation: "接入“虚数”自动化调度系统"
MIL_Sport_Connect_Imaginary_Automation_desc: "将晄轮大祭筹备数据接入千年信息管理系统“虚数”后，系统可以自动调配当月剩余预算，把没有及时使用的资源转化为更稳定的筹备进度。"
MIL_Sport_Connect_Imaginary_Automation_tt: "启用§Y“虚数”自动化调度§!：每月月度更新时，将剩余经费转换为准备综合评分，每月最多§G+5§!。\n科技等级1-2：每§Y4§!点经费转换§G1§!点评分\n科技等级3-4：每§Y3§!点经费转换§G1§!点评分\n科技等级5：每§Y2§!点经费转换§G1§!点评分"
MIL_Sport_Volunteer_Coordination_Center: "志愿者统筹中心"
MIL_Sport_Volunteer_Coordination_Center_desc: "晄轮大祭需要大量学生志愿者参与现场引导、秩序维护与后勤协助。建立临时统筹中心可以让这些善意不至于在混乱的排班中被白白浪费。"
MIL_Sport_Volunteer_Coordination_Center_tt: "学生支持度：§G+8%§!\n准备综合评分：§G+5§!"
MIL_Sport_Venue_Stress_Test: "会场压力测试"
MIL_Sport_Venue_Stress_Test_desc: "在正式开幕前，研讨会可以组织一次完整的会场压力测试，提前模拟入场、疏散、设备联调和突发状况处理。"
MIL_Sport_Venue_Stress_Test_condition_tt: "需要处于§Y最后3个月§!，且不能是§Y最后1个月§!；场地准备程度需要达到§Y3§!级以上。"
MIL_Sport_Venue_Stress_Test_tt: "准备综合评分：§G+15§!"
MIL_Sport_Temporary_Sponsor_Recruitment: "临时赞助招募"
MIL_Sport_Temporary_Sponsor_Recruitment_desc: "即使不引入大型学院作为正式赞助方，千年内部的企业、社团和周边商户也能提供一些临时资源。"
MIL_Sport_Temporary_Sponsor_Recruitment_tt: "当前可用经费：§G+10§!\n这笔临时经费可以让当前经费短期超过上限；下个月月度更新时仍会按当前经费上限刷新。"
MIL_Sport_Use_Reserve_Materials: "动用储备物资"
MIL_Sport_Use_Reserve_Materials_desc: "如果准备工作已经走到最后，却仍然无法达到令人满意的结果，研讨会可以动用一批原本不该在此时使用的储备物资。这样做能救急，但代价也会被清楚地记在账上。"
MIL_Sport_Use_Reserve_Materials_condition_tt: "需要处于§Y最后3个月§!，准备综合评分低于§Y160§!，且晄轮大祭主要筹备国策均已完成。"
MIL_Sport_Use_Reserve_Materials_tt: "准备综合评分：§G+30§!\n稳定度：§R-5%§!\n战争支持度：§R-5%§!"
MIL_Sport_Adjust_Event_Program: "调整大会项目"
MIL_Sport_Adjust_Event_Program_desc: "将部分运动项目改为互动、问答和趣味协作项目，可以降低普通学生对晄轮大祭的抵触，但临时调整赛程会压缩原本的准备成果。"
MIL_Sport_Adjust_Event_Program_tt: "当前可用经费：§R-5§!\n准备综合评分：§R-10§!\n学生支持度：§G+10%§!"
MIL_Sport_Requisition_Unplanned_Equipment: "调取计划外体育器材"
MIL_Sport_Requisition_Unplanned_Equipment_desc: "从正常教学与社团训练中临时调取一批不在原计划内的体育器材，可以快速补齐会场准备缺口，但势必会影响学生们的日常安排。"
MIL_Sport_Requisition_Unplanned_Equipment_tt: "当前可用经费：§R-5§!\n学生支持度：§R-15%§!\n准备综合评分：§G+10§!"

# 2026-05-20: 与其他大型学院合作决议
MIL_Sport_Cooperation_GEH: "寻求格黑娜合作"
MIL_Sport_Cooperation_GEH_desc: "格黑娜拥有足够的资源与影响力。只要对方愿意加入筹办，我们可以立刻扩大晄轮大祭的经费获取上限，但最终收益也必须分给赞助方。"
MIL_Sport_Cooperation_TRI: "寻求圣三一合作"
MIL_Sport_Cooperation_TRI_desc: "圣三一的声望和组织能力会显著降低筹备压力。合作当然不是免费的，千年需要在结算时分享一部分成果。"
MIL_Sport_Cooperation_SHA: "寻求山海经合作"
MIL_Sport_Cooperation_SHA_desc: "山海经能提供一定程度的商业与后勤协助。她们的合作规模有限，但仍能为预算带来可靠补充。"
MIL_Sport_Cooperation_RWT: "寻求赤冬合作"
MIL_Sport_Cooperation_RWT_desc: "赤冬也许愿意以独特方式表达支持。至于这份支持能否转化为稳定预算，那就是另一个问题了。"
MIL_Sport_Cooperation_HYA: "寻求百鬼夜行合作"
MIL_Sport_Cooperation_HYA_desc: "百鬼夜行的节庆经验和外部渠道可以帮助晄轮大祭筹备。合作规模有限，但足以缓解部分压力。"
MIL_Sport_Cooperation_Limit_tooltip: "通过大型学院合作获得的经费获取上限不能超过§Y20§!点。"

MIL_Sport_Improve_Millennium_Infrastructure: "改善学园基础设施"
MIL_Sport_Improve_Millennium_Infrastructure_desc: "晄轮大祭不仅是一场大运动会，实际上也是一场大型的学园交流会，基础设施不仅有助于大运动会的正常开展，也有助于提升学园的形象，因此，对学园周边基础设施进行建设有助于晄轮大祭的开展，也能提升晄轮大祭的支持度。"
MIL_Sport_Improve_Millennium_Infrastructure_tooltip: "准备综合评分：§G+2%§!\n学生支持度：§G+5%§!"

MIL_Sport_Constructing_Sports_Venues: "修建运动会场地"
MIL_Sport_Constructing_Sports_Venues_desc: "毫无疑问，运动会要有专业的场地才能开展，尽管学园已经有了一些基础的场地，但对于晄轮大祭而言还是远远不够，运动会场地的修建程度将直接决定运动会的效果，所以尽管花费高昂，但请尽可能完成对运动会场地的建设。这些场地在之后也有助于学园的体育活动，因此能赢得学生的支持。"
BARE_MIL_sport_Building_Score_Max_Level_tooltip: "最多建设5级场地([?BARE_MIL_sport_Building_Score_Var]/5)"

MIL_Sport_Constructing_Sports_Venues_tooltip: "准备综合评分：§G+[?MIL_Sport_Constructing_Sports_Venues_Score_Add_Temp]%§!\n学生支持度：§G+5%§!\n场地准备程度：§G+1§!"

MIL_Sport_Crackdown_on_Sabotage: "严厉打击混混和破坏分子"
MIL_Sport_Crackdown_on_Sabotage_desc: "我们已经确认已经有许多不怀好意的眼神看向了晄轮大祭，她们可能有着各种各样的目的，但她们最终的结果都会是毁掉晄轮大祭。通过调度额外的经费，我们可以让C&C先发制人，从而减少破坏的效果。不过，每次出击后，C&C需要额外的经费和一定的时间才能继续行动。"
MIL_Sport_Crackdown_on_Sabotage_tooltip: "§Y降低一次破坏事件的破坏程度§!"



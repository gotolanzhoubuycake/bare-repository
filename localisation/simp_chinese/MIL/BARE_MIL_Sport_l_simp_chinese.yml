MIL_Sport_Fee_Add_Button_tooltip: "§Y提高经费等级§!\n可调整条件：\n[Get_MIL_Sport_Fee_Adjust_Focus_Status] 已完成国策§Y研讨会会计的烦恼§!\n[Get_MIL_Sport_Fee_Add_Level_Status] 当前经费等级低于§Y5§!\n[Get_MIL_Sport_Fee_Monthly_Adjust_Status] 本月尚未调整经费等级\n\n§Y经费等级表§!\n等级1：经费上限§Y+0§!，生活消费品需求§R+10%§!，学生支持度每月变化§Y0§!\n等级2：经费上限§G+5§!，生活消费品需求§R+20%§!，学生支持度每月变化§Y0§!\n等级3：经费上限§G+10§!，生活消费品需求§R+30%§!，学生支持度每月变化§R-1§!\n等级4：经费上限§G+15§!，生活消费品需求§R+40%§!，学生支持度每月变化§R-2§!\n等级5：经费上限§G+20§!，生活消费品需求§R+50%§!，学生支持度每月变化§R-4§!\n\n§Y实际影响§!\n当前经费不会立即增加；新的经费上限和月度恢复量会在§Y下个月月度更新§!时生效。"

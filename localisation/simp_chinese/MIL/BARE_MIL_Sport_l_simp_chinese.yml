MIL_Sport_Security_Add_Button_tooltip: "§Y提高安保等级§!\n可调整条件：\n[Get_MIL_Sport_Security_Adjust_Focus_Status] 已完成国策§Y隐藏在暗中的反对§!\n[Get_MIL_Sport_Security_Add_Level_Status] 当前安保等级低于安保等级上限\n[Get_MIL_Sport_Security_Monthly_Adjust_Status] 本月尚未调整安保等级\n\n§Y动态民族精神：晄轮大祭-安保投入§!\n等级1：月度经费恢复§R-1§!，无事发生权重§Y40%§!\n等级2：月度经费恢复§R-2§!，无事发生权重§Y45%§!\n等级3：月度经费恢复§R-3§!，无事发生权重§Y50%§!\n等级4：月度经费恢复§R-4§!，无事发生权重§Y55%§!\n等级5：月度经费恢复§R-5§!，无事发生权重§Y60%§!\n\n§Y破坏事件影响§!\n提高安保等级会提高无事发生权重，并减少普通破坏事件造成的准备评分与学生支持度损失。"
MIL_Sport_Security_Sub_Button_tooltip: "§Y降低安保等级§!\n可调整条件：\n[Get_MIL_Sport_Security_Adjust_Focus_Status] 已完成国策§Y隐藏在暗中的反对§!\n[Get_MIL_Sport_Security_Sub_Level_Status] 当前安保等级高于§Y1§!\n[Get_MIL_Sport_Security_Monthly_Adjust_Status] 本月尚未调整安保等级\n\n§Y动态民族精神：晄轮大祭-安保投入§!\n等级1：月度经费恢复§R-1§!，无事发生权重§Y40%§!\n等级2：月度经费恢复§R-2§!，无事发生权重§Y45%§!\n等级3：月度经费恢复§R-3§!，无事发生权重§Y50%§!\n等级4：月度经费恢复§R-4§!，无事发生权重§Y55%§!\n等级5：月度经费恢复§R-5§!，无事发生权重§Y60%§!\n\n§Y破坏事件影响§!\n降低安保等级会降低无事发生权重，并削弱对普通破坏事件损失的控制。"
MIL_Sport_Tech_Add_Button_tooltip: "§Y提高科技等级§!\n可调整条件：\n[Get_MIL_Sport_Tech_Adjust_Focus_Status] 已完成国策§Y科技的力量§!\n[Get_MIL_Sport_Tech_Add_Level_Status] 当前科技等级低于科技等级上限\n[Get_MIL_Sport_Tech_Monthly_Adjust_Status] 本月尚未调整科技等级\n\n§Y动态民族精神：晄轮大祭-科研投入§!\n每级科技等级：稳定度§G+1%§!，研究速度§G+1%§!，建造速度§G+2%§!，学生支持度每月变化§G+1§!。\n经费消耗：完成§Y如火如荼的建设工作§!前，每级月度经费恢复§R-5§!；完成后每级§R-3§!。\n\n§Y月度准备评分§!\n科技等级1-2：§Y+0§!\n科技等级3：§G+1§!\n科技等级4：§G+2§!\n科技等级5：§G+3§!\n这些准备评分会在每月更新时加入。"
MIL_Sport_Tech_Sub_Button_tooltip: "§Y降低科技等级§!\n可调整条件：\n[Get_MIL_Sport_Tech_Adjust_Focus_Status] 已完成国策§Y科技的力量§!\n[Get_MIL_Sport_Tech_Sub_Level_Status] 当前科技等级高于§Y1§!\n[Get_MIL_Sport_Tech_Monthly_Adjust_Status] 本月尚未调整科技等级\n\n§Y动态民族精神：晄轮大祭-科研投入§!\n每级科技等级：稳定度§G+1%§!，研究速度§G+1%§!，建造速度§G+2%§!，学生支持度每月变化§G+1§!。\n降低后会减少这些民族精神收益，并降低科技带来的月度经费消耗。\n\n§Y月度准备评分§!\n科技等级1-2：§Y+0§!\n科技等级3：§G+1§!\n科技等级4：§G+2§!\n科技等级5：§G+3§!\n降到3级以下时，不再获得科技带来的月度准备评分。"


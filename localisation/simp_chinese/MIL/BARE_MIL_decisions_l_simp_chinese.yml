 MIL_security_reform_automaton_operation_training: "自动机操作训练"
 MIL_security_reform_automaton_operation_training_desc: "通过一轮轮可重复的自动机操作训练，安保部可以积累陆军改革经验，并逐步修正长期和平带来的作战迟钝。"
 MIL_security_reform_drone_operation_training: "无人机操作训练"
 MIL_security_reform_drone_operation_training_desc: "空中力量的恢复离不开操作员日复一日的训练。短期训练不能立刻解决所有问题，但足以让改革进度稳定前进。"
 MIL_security_reform_ground_tactics_improvement: "安全委员会地面战术改进"
 MIL_security_reform_ground_tactics_improvement_desc: "安保部需要重新建立适应校园防卫的地面战术体系，尤其是自动机、特战生和普通安保部队之间的协同方式。"
 MIL_security_reform_experimental_mech_refit: "作战机甲试验性改造"
 MIL_security_reform_experimental_mech_refit_desc: "完成机械化方向的初步改革后，工程师部可以协助安保部对作战机甲进行试验性改造，以验证新式装备的实战潜力。"
 MIL_security_reform_special_ops_system_upgrade: "千年特战生作战系统升级"
 MIL_security_reform_special_ops_system_upgrade_desc: "千年特战生编制成型后，还需要一套专门的作战系统来让她们真正成为可持续部署的精锐力量。"
 MIL_security_reform_update_drone_manual: "更新无人机操作手册"
 MIL_security_reform_update_drone_manual_desc: "旧版无人机操作手册已经无法适应安保部当前需求。更新流程、接口和协同规范可以显著提高空军改革效率。"
 MIL_security_reform_optimize_ground_crew: "优化地勤工作效率"
 MIL_security_reform_optimize_ground_crew_desc: "无人机与飞行器的妥善维护同样决定空中力量的战斗力。优化地勤流程将让安保部空中部门更加可靠。"
 MIL_security_reform_practical_aircraft_design: "实用化飞行器设计"
 MIL_security_reform_practical_aircraft_design_desc: "千年从不缺少大胆的飞行器设计，但安保部真正需要的是能稳定量产、可靠维护、适合作战的实用化方案。"
 MIL_aircraft_design_standardize_airframe: "统一飞行器设计规范"
 MIL_aircraft_design_standardize_airframe_desc: "安保部将压缩过度实验化的设计分支，统一飞行器接口、维护流程与量产标准，让千年无人机重新回到可维护、可部署的轨道上。"
 MIL_aircraft_design_mass_production_review: "量产化审查"
 MIL_aircraft_design_mass_production_review_desc: "完成规格统一后，工程师部可以进一步审查无人机生产线，将实验样机的经验转化为稳定可靠的量产体系。"
 MIL_aircraft_design_expand_experimental_specs: "扩大实验规格"
 MIL_aircraft_design_expand_experimental_specs_desc: "并非所有前卫设计都应该被抹平。安保部将保留高风险实验规格，让千年飞行器以更高成本换取战场上的性能优势。"
 MIL_aircraft_design_high_performance_platform: "高性能飞行平台"
 MIL_aircraft_design_high_performance_platform_desc: "只要能承受维护与生产压力，千年的飞行器就不必向平庸妥协。新的高性能平台将把那些大胆方案真正推上战场。"
 MIL_special_ops_factory_expansion: "扩建特战装备生产线"
 MIL_special_ops_factory_expansion_desc: "千年特战生已经成为学院手中真正可靠的利刃。为了维持这支精锐部队的长期部署，工程师部与安保部将扩建专用重武器生产线。"
 MIL_steel_wall_factory_expansion: "扩建自动机重工产线"
 MIL_steel_wall_factory_expansion_desc: "钢铁洪流需要稳定的重工业支撑。新的重武器生产线将为自动机和战斗机甲部队提供持续扩编所需的装备。"
 MIL_soaring_eagle_factory_expansion: "扩建空军装备生产线"
 MIL_soaring_eagle_factory_expansion_desc: "千年的天空已经重新掌握在我们手中。更多武器工厂将为空中部队提供稳定的机体、挂载与备件供应。"
# MIL_cae_war_decision_category_desc: "通过一系列决议打击凯撒的经济状况，为与凯撒的战争做好准备。"
 MIL_cae_war_decision_category_desc: "凯撒集团对于统治基沃托斯的野心毫不掩饰，而最终，他们将肮脏的手伸到了我们的头上，对于这种肮脏卑劣之徒，唯有彻底的失败才能让他们认清现实。\n作为一个向钱看的巨型企业，凯撒集团的经济状况直接决定了他们的实力，如果我们的自治区土地被占领，或者说我们遭受了损失，凯撒集团的声势将会大涨，他们的股价将进一步提高，投资也会变得更多，进而增强他们的实力。反之，如果我们可以守住我们的土地并将战火燃至他们，或是他们遭受了重大损失，他们的声势将会下降，并让他们遭受严重的经济损失，最终削弱其战争潜力，同时，迫使他们维持大量部队，争取外部支持并发起各项行动也可以直接打击他们的经济状况。\n一旦凯撒集团遭受了重大损失，他们将别无选择，只能接受失败。"

# 决议1：号召停用凯撒商品
 MIL_boycott_CAE_products_desc: "我们的学园正在和敌人开战，但我们的学生却还在用敌人的商品？我们将号召学生们用其他产品来取代凯撒的商品，虽然这势必会增加成本，但我们不能再资敌了。"
 MIL_boycott_CAE_products_tt: "民族精神$MIL_fight_against_cae$追加效果：生活消费品系数+10%，战争支持度+5%\n每月凯撒经济状况-1%"

# 决议2：全面禁用凯撒商品
 MIL_ban_all_CAE_products: "全面禁用凯撒商品"
 MIL_ban_all_CAE_products_desc: "“别让罪恶的章鱼图标出现在千年学园”，我们将下令全面禁止使用凯撒的商品，并免费提供我们的商品来取而代之，尽管这会提升我们的财政压力，但失去我们这个大市场，凯撒的日子也不会好过。"
 MIL_ban_all_CAE_products_tt: "民族精神$MIL_fight_against_cae$追加效果：生活消费品系数+10%，战争支持度+5%\n每月凯撒经济状况-1.5%"

# 决议3：对凯撒实施网络攻击
 MIL_cyber_attack_CAE: "对凯撒实施网络攻击"
 MIL_cyber_attack_CAE_desc: "众所周知，贝里塔斯拥有全基沃托斯最为强大的网络攻防能力，她们会很乐意听到她们有了茫茫多的靶机来进行攻击的。"
 MIL_cyber_attack_CAE_tt: "凯撒经济状况-5%"
 MIL_cyber_attack_CAE_first_tt: "凯撒经济状况-5%\n凯撒获得临时民族精神$CAE_network_paralysis$（45天）!"

# 决议4：释放对千年有利的谈判消息
 MIL_release_negotiation_info: "释放对千年有利的谈判消息"
 MIL_release_negotiation_info_desc: "对于凯撒集团这种巨型企业，一点风吹草动都将影响他们的股价，将对我们有利的谈判信息经过一点公关加工，辅以我们的媒体宣传，凯撒的公关将会焦头烂额起来。"
 MIL_release_negotiation_info_tt: "凯撒经济状况-5%"

# 决议5：寻求联邦学生会的支持
 MIL_seek_CEN_support: "寻求联邦学生会的支持"
 MIL_seek_CEN_support_desc: "凯撒集团在联邦学生会有着强大的影响力，因此在这种明确的侵略行为中，联邦学生会选择视而不见......\n但我们也有！以基沃托斯最为强大的学园之一向联邦学生会发出号召，我们能让一部分人唤起学生会真正的职责，进而给凯撒集团带来大麻烦。"
 MIL_seek_CEN_support_tt: "凯撒经济状况-10%\n触发事件"

# 决议6：寻求其他学院的支持
 MIL_seek_TRI_support: "寻求圣三一的支持"
 MIL_seek_TRI_support_desc: "茶会一直在监视着凯撒集团的各项违法行为，和茶会的交涉可以将她们拉入我们的阵营，进而影响凯撒在圣三一的定位。"
 MIL_seek_GEH_support: "寻求格黑娜的支持"
 MIL_seek_GEH_support_desc: "万魔殿一直对于凯撒和她们的产业竞争很不爽，她们很愿意给凯撒集团添点堵。"
 MIL_seek_SHA_support: "寻求山海经的支持"
 MIL_seek_SHA_support_desc: "玄龙门一直在严密监视着凯撒对山海经的影响，而玄武商会也十分反感凯撒的恶意竞争行为，消除凯撒在山海经的影响符合她们的利益。"
 MIL_seek_HYA_support: "寻求百鬼夜行的支持"
 MIL_seek_HYA_support_desc: "阴阳部和节日庆典委员会仍然对“度假村大逃杀”记忆犹新，她们肯定不会愿意凯撒再这么肆意妄为。"
 MIL_seek_RWT_support: "寻求赤冬的支持"
 MIL_seek_RWT_support_desc: "作为奉行集体主义的冰霜之地，赤冬本来就对肆意妄为，铺张浪费的凯撒没啥好感，更何况基沃托斯的头号刺头-工务部对凯撒集团这种布尔乔亚更是深恶痛绝了，她们会支持我们的。"
 MIL_seek_academy_support_tt: "凯撒经济状况-5%"

# 凯撒战争线决议 GUI
 BARE_MIL_cae_war_GUI_Title_Text: "§W企业战争§!"
 BARE_MIL_cae_war_GUI_Detail_Text: "§W凯撒集团对基沃托斯的贪婪最终让它发动了这场战争，而我们要站在阻止它们野心的最前线。这场战争将决定基沃托斯能否守护学园都市这个名义共同体，我们不能退缩。\n凯撒集团的经济状况直接决定了它继续战争的动力，我们的自治区领土丢失、部队被击溃会导致市场对凯撒集团更有信心，进而提升它们的经济状况。\n反之，坚守阵地、击溃入侵者，并发动反攻，能让凯撒集团在基沃托斯的影响力极大幅削弱，进而重创它们的经济状况。\n如果凯撒集团的经济状况达到200%，或者我们被完全击溃，那我们的战斗就失去意义，也意味着凯撒集团大获全胜。反之，如果我们能将它们的经济状况削弱到0，或者完全击溃它们，那它们就再也无法继续作战，并将为自己的野心付出代价。\n千禧科技学园将众志成城，为基沃托斯的未来奋战到最后一刻！§!"

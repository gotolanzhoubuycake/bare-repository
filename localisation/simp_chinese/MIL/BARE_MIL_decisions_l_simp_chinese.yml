 MIL_bop_upgrade_network_system: "升级校内网络系统"
 MIL_bop_upgrade_network_system_desc: "升级校内网络系统以提升基础设施水平。"
 MIL_bop_upgrade_network_system_tooltip: "权力平衡右移10%，完成后在千年随机核心地区获得1基础设施，权力平衡左移5%"

 MIL_bop_upgrade_industrial_facilities: "工业设施升级"
 MIL_bop_upgrade_industrial_facilities_desc: "对校内工业设施进行集中升级。启动时财政危机向危机侧移动15%；90日后随机获得一张工业、建筑或机床技术100%研究加成卡，并向稳定侧移动20%。第一次完成时，“千年大赏”还会永久获得每周向稳定侧移动0.5%的效果。"
 MIL_bop_upgrade_industrial_facilities_tooltip: "权力平衡右移15%，完成后随机获得工业、建筑或机床科技100%加成卡*1，权力平衡左移20%"
 MIL_bop_upgrade_industrial_facilities_tech_bonus: "工业设施升级"
 MIL_bop_upgrade_industrial_facilities_first_completed_tt: "§Y$MIL_Millennium_Award$§!追加效果：每周权力平衡向§Y稳定§!侧移动§G0.5%§!"

 MIL_bop_full_virtual_system_access: "全面接入“虚数”系统"
 MIL_bop_full_virtual_system_access_desc: "全面接入“虚数”系统以提升学园整体科技水平。"
 MIL_bop_full_virtual_system_access_tooltip: "占用15民工，权力平衡左移20%，完成后民族精神追加科研速度+5%、生产效率上限+5%、生产效率增长+5%、工厂产出+5%、每周权力平衡左移1%，权力平衡左移30%"

#千年大赏本地化

 MIL_award_decisions: "千年大赏"
 MIL_award_decisions_desc: "千年大赏汇集了千年内部三条并行研发线：真理部的“虚数”计划、工程师部的新发明，以及游戏开发部的新游开发。"
 MIL_award_overview_placeholder: "千年大赏总览"
 MIL_award_overview_placeholder_desc: "千年大赏是千年内部年度研发成果的汇总机制。真理部、工程师部和游戏开发部的项目会分别在独立决议组中推进；完成“燃烧的经费”后，工程师部与游戏开发部的成果会按年度结算为永久增益。"
 MIL_award_annual_settlement: "千年大赏年度结算"
 MIL_award_annual_settlement_desc: "本年度项目结果将在倒计时结束时转化为“千年大赏”的永久增益，结算后自动开始下一年度。\n\n工程师部：大成功§Y[?MIL_award_engineer_department_annual_great_success|0]§! / 成功§Y[?MIL_award_engineer_department_annual_success|0]§! / 不尽人意§Y[?MIL_award_engineer_department_annual_unsatisfactory|0]§!\n游戏开发部：大受欢迎§Y[?MIL_award_game_development_annual_great_success|0]§! / 多半好评§Y[?MIL_award_game_development_annual_success|0]§! / 不温不火§Y[?MIL_award_game_development_annual_neutral|0]§!"
 MIL_award_imaginary_number_network_decisions: "“虚数”计划"
 MIL_award_imaginary_number_network_decisions_desc: "真理部正在推进“虚数”系统的基础开发。该计划需要等待开发倒计时归零，并完成新的基站网络建设后，才能真正投入使用。"
 MIL_award_imaginary_number_network_overview: "“虚数”计划"
 MIL_award_imaginary_number_network_overview_desc: "真理部正在推进“虚数”系统的基础开发。该计划需要等待开发倒计时归零，并完成新的基站网络建设后，才能真正投入使用。\n\n当前已建设基建：§Y[?MIL_award_imaginary_number_network_instruf|0]/10§!"
 MIL_award_imaginary_number_network_more_money: "投入更多资金"
 MIL_award_imaginary_number_network_more_money_desc: "投入额外经费支持当前虚数升级。生活消费品需求提高20%并持续60日；15日后使当前升级倒计时减少60日。"
 MIL_award_imaginary_number_network_more_people: "指派更多人手"
 MIL_award_imaginary_number_network_more_people_desc: "临时抽调研究人员支持当前虚数升级。科研速度降低5%并持续60日；15日后使当前升级倒计时减少60日。"
 MIL_award_imaginary_number_network_fix: "集中资源研发"
 MIL_award_imaginary_number_network_fix_desc: "集中其他项目的研发资源。15日后使当前虚数升级倒计时减少15日；正在进行的工程师部和游戏开发部项目倒计时各增加5日。"
 MIL_award_imaginary_number_network_update: "提高产品质量"
 MIL_award_imaginary_number_network_update_desc: "延长当前虚数升级15日，并使本轮大成功概率提高5%。第一轮虚数升级期间不可使用。"
 MIL_award_imaginary_number_network_build: "建设新的基站网络"
 MIL_award_imaginary_number_network_build_desc: "指定一个当前实控且仍可提升基础设施的州，投入3座民用工厂建设新的基站网络。15日后该州增加1级基础设施；所有地区共用15日冷却。"
 MIL_award_imaginary_number_network_build_cooldown_tt: "基站建设决议未处于冷却中"
 MIL_award_imaginary_number_network_new_invention: "“虚数”系统"
 MIL_award_imaginary_number_network_optimize: "升级“虚数”系统"
 MIL_award_imaginary_number_network_optimize_desc: "持续升级已经上线的“虚数”系统。每轮完成时有10%概率大成功，否则成功；大成功使科研速度和特殊项目速度各提高2%，成功则各提高1%。每完成一轮，下一轮基础时长增加30日。"
 MIL_award_engineer_department_decisions: "工程师部的新发明"
 MIL_award_engineer_department_decisions_desc: "工程师部的新发明以循环开发为核心，通过建设新设备、承接研讨会订单和支持额外开发来推动项目完成。"
 MIL_award_engineer_department_overview: "工程师部的新发明"
 MIL_award_engineer_department_overview_desc: "工程师部正在推进全新的发明项目。开发倒计时结束后，还需要完成至少一项特殊任务。每类总进度均包含已经完成和正在进行中的决议。\n\n新设备建设：§Y[?MIL_award_engineer_department_build_progress|0]%§!/100%（总进度§Y[?MIL_award_engineer_department_build_total_progress|0]%§!/100%）\n额外开发：§Y[?MIL_award_engineer_department_support_progress|0]%§!/100%（总进度§Y[?MIL_award_engineer_department_support_total_progress|0]%§!/100%）\n研讨会订单：§Y[?MIL_award_engineer_department_order_progress|0]%§!/100%（总进度§Y[?MIL_award_engineer_department_order_total_progress|0]%§!/100%）"
 MIL_award_engineer_department_project_window_tt: "工程师部开发任务正在进行，或开发倒计时已经结束并正在等待特殊任务完成"
 MIL_award_engineer_department_build_progress_available_tt: "本轮新设备建设总进度低于§Y100%§!"
 MIL_award_engineer_department_support_progress_available_tt: "本轮额外开发总进度低于§Y100%§!"
 MIL_award_engineer_department_order_progress_available_tt: "本轮研讨会订单总进度低于§Y100%§!"
 MIL_award_engineer_department_more_money: "投入更多资金"
 MIL_award_engineer_department_more_money_desc: "投入额外经费支持工程师部。生活消费品需求提高20%并持续60日；15日后使当前项目倒计时减少60日。"
 MIL_award_engineer_department_more_people: "指派更多人手"
 MIL_award_engineer_department_more_people_desc: "抽调研究人员支持工程师部。科研速度降低5%并持续60日；15日后使当前项目倒计时减少60日。"
 MIL_award_engineer_department_fix: "集中资源研发"
 MIL_award_engineer_department_fix_desc: "集中其他项目的研发资源。15日后使当前工程师部项目倒计时减少15日；正在进行的虚数升级和游戏开发部项目倒计时各增加5日。"
 MIL_award_engineer_department_update: "提高产品质量"
 MIL_award_engineer_department_update_desc: "将当前项目延长15日，使本轮成功率提高10%、大成功率提高5%。首次开发期间不可使用。"
 MIL_award_engineer_department_civilian_factory: "使用新设备建造民工"
 MIL_award_engineer_department_civilian_factory_desc: "投入3座民用工厂并花费50政治点数，60日后获得1座地图外民用工厂，并增加50%新设备建设进度。"
 MIL_award_engineer_department_army_factory: "使用新设备建造军工"
 MIL_award_engineer_department_army_factory_desc: "投入3座民用工厂并花费35政治点数，45日后获得1座地图外军用工厂，并增加34%新设备建设进度。"
 MIL_award_engineer_department_infrastructure: "使用新设备建造基础设施"
 MIL_award_engineer_department_infrastructure_desc: "在指定实控州投入3座民用工厂并花费25政治点数，30日后增加1级基础设施，并增加25%新设备建设进度。所有州共用进行中的决议和完成后的30日冷却。"
 MIL_award_engineer_department_infrastructure_cooldown_tt: "新设备基建决议未处于共享冷却中"
 MIL_award_engineer_department_whimsical_ideas: "支持工程师部的奇思妙想"
 MIL_award_engineer_department_whimsical_ideas_desc: "投入3座民用工厂并花费50政治点数，30日后使“千年大赏”随机获得建造速度、工厂产出、生产效率上限或生产效率增长+1%，并增加34%额外开发进度。"
 MIL_award_engineer_department_whimsical_ideas_reward_tt: "§Y$MIL_Millennium_Award$§!随机获得以下一项永久加成：建造速度§G+1%§!、工厂产出§G+1%§!、生产效率上限§G+1%§!或生产效率增长§G+1%§!；并增加§G34%§!额外开发进度"
 MIL_award_engineer_department_more_payout: "下达单兵装备订单"
 MIL_award_engineer_department_more_payout_desc: "占用5座军用工厂60日，完成后选择接收一类已解锁的单兵或支援装备，并增加34%研讨会订单进度。"
 MIL_award_engineer_department_more_payout_mech: "下达机甲订单"
 MIL_award_engineer_department_more_payout_mech_desc: "占用5座军用工厂60日，完成后选择接收一类已解锁的机甲，并增加34%研讨会订单进度。"
 MIL_award_engineer_department_more_payout_tank: "下达坦克订单"
 MIL_award_engineer_department_more_payout_tank_desc: "占用5座军用工厂60日，完成后选择接收一类已解锁的坦克，并增加34%研讨会订单进度。"
 MIL_award_engineer_department_more_payout_fire_support: "下达火力支援装备订单"
 MIL_award_engineer_department_more_payout_fire_support_desc: "占用5座军用工厂60日，完成后选择接收一类已解锁的火力支援装备，并增加34%研讨会订单进度。"
 MIL_award_engineer_department_new_invention: "工程师部的新发明"
 MIL_award_engineer_department_new_invention_desc: "项目基础周期为180日，每完成一轮，下一轮增加30日。倒计时结束且三类特殊任务中至少一类已完成100%后结算；首次必定大成功。"
 MIL_award_game_development_decisions: "游戏开发部的新游开发"
 MIL_award_game_development_decisions_desc: "游戏开发部将在新的激励计划下推进新游开发。项目结果会影响政治点数、稳定度和后续年度结算。"
 MIL_award_game_development_overview: "游戏开发部的新游开发"
 MIL_award_game_development_overview_desc: "游戏开发部正在推进新游开发。第一轮为180日且判定为年度粪作，但当前不触发事件或获得奖励，随后直接开始180日的第二轮；第二轮必定大受欢迎；第三轮从210日开始，此后每轮增加30日。第三轮起基础结果概率为：大受欢迎0%、多半好评10%、不温不火90%。"
 MIL_award_game_development_more_money: "投入更多资金"
 MIL_award_game_development_more_people: "指派更多人手"
 MIL_award_game_development_fix: "集中资源研发"
 MIL_award_game_development_update: "提高产品质量"
 MIL_award_game_development_propaganda: "提供宣传经费"
 MIL_award_game_development_propaganda_desc: "花费25政治点数，令生活消费品需求提高10%并持续30日；15日后改善本轮新游评价概率。冷却30日，第三轮开发起可用。"
 MIL_award_game_development_test: "开发试玩版本"
 MIL_award_game_development_test_desc: "花费25政治点数，令政治点数获取降低3%并持续30日；45日后改善本轮新游评价概率并触发“玩家反馈”。冷却45日，第三轮开发起可用。"
 MIL_award_game_development_debug: "改进游戏机制设计"
 MIL_award_game_development_debug_desc: "花费25政治点数并持续60日，完成后改善本轮新游评价概率。冷却45日，第三轮开发起可用。"
 MIL_award_game_development_improve_chance_tt: "若§Y不温不火§!概率仍高于0：本轮§Y大受欢迎§!概率§G+5%§!、§Y多半好评§!概率§G+10%§!；否则改为§Y大受欢迎§!概率§G+10%§!"
 MIL_award_game_department_new_invention: "千年游戏大赏"
 MIL_award_game_department_new_invention_desc: "当前新游正在开发。第一轮和第二轮结果固定；第三轮起按照本轮评价概率结算，并在完成后自动开始下一轮。"
 MIL_award_game_development_bonus_timeout: "新游热度"
 MIL_award_game_development_bonus_timeout_desc: "新游戏的热度正在为游戏开发部和研讨会带来短期收益。"


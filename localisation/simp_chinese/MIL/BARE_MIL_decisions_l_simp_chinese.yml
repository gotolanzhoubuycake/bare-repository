 MIL_security_reform_decision_category: "千年校园防卫改革"
 MIL_security_reform_decision_category_desc: "千年安全委员会正在推进§Y$MIL_security_reform_progress_modifier$§!。陆军改革与空军改革共同推进同一项§Y改革总进度§!，但单一军种最多只能贡献§Y75%§!，必须同时补强地面与空中力量。\n\n§Y当前陆军贡献：§![?MIL_security_reform_army_progress_var|Y0]%\n§Y当前空军贡献：§![?MIL_security_reform_air_progress_var|Y0]%\n§Y改革总进度：§![?MIL_security_reform_total_progress_var|Y0]%\n\n陆军贡献每提高§Y5%§!，§Y$MIL_security_reform_progress_modifier$§!将获得§G+1.0%§!$MODIFIERS_ARMY_ATTACK_FACTOR$、§G+1.0%§!$MODIFIERS_ARMY_DEFENCE_FACTOR$、§G+1.0%§!$MODIFIER_PLANNING_SPEED$和§G+1.0%§!$MODIFIER_MAX_PLANNING_FACTOR$。\n\n空军贡献每提高§Y5%§!，§Y$MIL_security_reform_progress_modifier$§!将获得§G+1.0%§!$MODIFIER_AIR_MISSION_EFFICIENCY$、§G+1.0%§!$MODIFIER_AIR_CAS_EFFICIENCY$和§G+1.0%§!$MODIFIER_AIR_AGILITY_FACTOR$。\n\n对应军种贡献达到§Y75%§!后，常规训练将暂缓开展；一次性改革项目仍可推进专项建设，但无法突破该军种的贡献上限。"

 MIL_bop_oparts_research: "进行欧帕兹研究"
 MIL_bop_oparts_research_desc: "对欧帕兹开展专项研究。启动时财政危机向危机侧移动10%；90日后在千年数据中心增加4点欧帕兹资源，并获得10%神秘项目突破进度。"
 MIL_bop_oparts_research_tooltip: "权力平衡右移10%，完成后千年数据中心获得4点欧帕兹资源和10%神秘项目突破进度"

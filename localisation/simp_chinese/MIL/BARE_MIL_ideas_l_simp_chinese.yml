MIL_millennium_dream: "千年之梦"
MIL_millennium_dream_troubled_desc: "即使晄轮大祭的过程并不顺利，这场大型活动仍然为千年留下了组织经验、技术积累与新的发展想象。\n\n当前等级：§Y进行不顺§!"
MIL_millennium_dream_partial_success_desc: "晄轮大祭至少证明了千年能够独立承担基沃托斯级别的大型活动。虽然结果仍有遗憾，但它已经成为学院继续前进的基础。\n\n当前等级：§Y部分成功§!"
MIL_millennium_dream_success_desc: "晄轮大祭的成功让千年学生真正看到了学院的组织力、技术力和未来潜力。这个成果正在转化为长期发展的动力。\n\n当前等级：§Y成功§!"
MIL_millennium_dream_great_success_desc: "晄轮大祭成为了千年历史上的里程碑。它不只是一次成功的活动，更是千年学生对未来共同愿景的确认。\n\n当前等级：§Y大成功§!"


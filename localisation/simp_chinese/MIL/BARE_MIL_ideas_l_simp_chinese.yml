MIL_outlook_of_the_Engineering_Department_desc: "工程师部是千年最重要的主力社团之一，她们的各种发明创造给千年带来了大量的进步与收益。在千年大赏逐步走上正轨之后，支持工程师部进行更多、更大胆的新技术开发，显然有助于进一步释放学院的研发潜力。"
# 当前禁用：下方工业线完整描述区已有相同本地化键，保留旧位置供核对。
# MIL_New_incentive_plan_desc: "尽管千年大赏如今在千年内部已经颇具含金量，但是研讨会依旧认为千年学生们的潜力还有巨大的挖掘空间，也因此，全新的激励计划新鲜出炉，旨在推动学生们更加积极的进行发明与创造来推动千年的进步与发展。"
# MIL_money_is_fire_desc: "为了配合激励计划，研讨会会计旱濑优香同学几乎是咬着牙同意了更多的经费用于此处，尽管知道这是用短期损失换取长远利益，但是我们的研讨会会计也因此更加严格的审计各个社团的成果与收益，她要尽最大可能保证，这些燃烧的经费每一分都花在了应该花的地方。"
MIL_Ruin_clearance_plan_desc: "废墟清理方案" 
MIL_new_development_plan_desc: "在研讨会和千年学生们的努力下，千年已经彻底摆脱了财政危机的阴云。所谓守得云开见月明，一份崭新的发展蓝图正在整个千年的面前缓缓展开，昭示着更加美好的未来。" 
MIL_new_progress_possible_desc: "随着我们手头终于有了些闲钱，我们可以开始考虑进行一些比较激进的技术应用，虽然会有些烧钱，但这会是值得的。" 
MIL_Promote_mobile_construction_technology_desc: "虽然研讨会至今还不清楚，这项革命性的技术，最初到底是因为什么原因被工程师部和真理部联合开发出来的，但是毫无疑问的是，如果忽略其中一些奇奇怪怪的功能和设定，这项技术将会为我们的建筑技术带来一场革命性的飞跃。" 
MIL_high_quantity_low_cost_desc: "根据一个很简单的道理，如果一项产品生产数量越大，那么在其他因素不变的情况下，前期的研发等投入将会被摊平在每一件被生产出来的产品之中，从而变相降低每一件产品的成本。而机动建设技术的大规模采用在事实上有效地降低的了我们的建设成本，使得我们可以用更低的价格来建造更多的建筑。" 
MIL_Technology_guarantees_quality_desc: "很显然，对于基沃托斯的现实需求来说，更为坚固乃至于可以直接抵挡学生们炮火的建筑是极受欢迎的，毕竟没人希望饭吃到一半就被炸个灰头土脸，亦或者是别的什么令人不快的情况，因此，我们也会用千年的先进技术来尽可能保障这种让人恼火的情况不再发生。" 
MIL_Upgrade_Imaginary_numbers_desc: "“虚数”得到了千年上下的一致认可。也是基于此，研讨会决定再次升级“虚数”，令其能够辅助高水平科研活动，为千年的发展再加一把力。" 
MIL_the_second_mil_tower_desc: "如今的千年已经有了长足的发展，不论是为了进一步推进废墟开发工作，还是发挥“虚数”的能力，亦或者是建立一个基沃托斯史无前例的科研中心，我们都需要完成这个庞大但是足以载入史册的工程，这将会是千年历史上重要的一步，因此，哪怕花费巨大且必定会迎来一些反对，研讨会依旧通过了这个计划。" 
MIL_Expand_Eridu_desc: "在经过全面的网络检查后，我们确认了埃里都对我们来说是安全的，而之前的交火也没有对埃里都产生太大的破坏-换句话说，我们现在有了一整座无人的要塞都市。\n是时候解除对埃里都的封锁，并让它变的更生活化一点的时候了。" 
MIL_Ruin_development_desc: "尽管对于废墟区域的初期开发遇到了不少困难，但是我们终究还是将其全部克服了。现在才是真正让我们放开手脚奋斗的时刻，就让千年的学生们在这昔日残骸之上建立起崭新的未来吧。" 
MIL_Clear_more_debris_areas_desc: "前期废墟开发的成功令千年的学生们对此兴致高涨，越来越多的学生们参与到了废墟区域的清理活动之中，这令我们的施工进度得到了极大的提升，当然，为了能够提供足够的运力，研讨会也投入了更多资源修建道路等基础设施以避免交通堵塞的情况出现。" 
MIL_Tower_mid_term_Project_desc: "我们顺利的完成了巨塔的前期工程，这是一个十分振奋的好消息，一些配套设施已经可以进行科研活动，巨塔的建设已经开始有了回报，这也使得对于新建巨塔的导致的不满减少了很多。" 
MIL_more_research_equipment_desc: "伴随着巨塔的施工不断推进，预定计划中的各种新式科研设备也随之落地，并开始为我们的科研活动提供帮助，其产出成果在可以预见的未来中将为千年的发展提供相当程度的助力。" 
MIL_better_Experimental_environment_desc: "由于事先得到了恰当的规划且废墟区域可以随意发挥建筑设计师的各种创意，我们成功在巨塔周边构建了一片环境优美的实验区域，这不仅令前来考察的千年学生们兴奋不已，也为各种科研实验提供了足够的条件。" 
MIL_nearly_completed_tower_desc: "激动人心的时刻终于要到来了，在漫长的建设工作之后，我们即将迎来巨塔彻底竣工的那一天，这是每一个千年学生所期待的时刻，所有人都在为这场盛典做着最后的贡献。" 
MIL_mil_wisdom_desc: "终于，我们迎来了那个激动人心的时刻，这第二座千年巨塔，宣告着废墟开发计划的完美结束，宣告着千年学生们取得的一个新的里程碑进展，宣告着千年在科研领域的又一巨大进步，欢呼吧，此刻，是属于每个千年学生的狂欢盛典。" 
MIL_clean_not_destory_desc: "废墟之中存在着大量有价值的遗物，如果其在清理过程中不慎遭到破坏会是一件令人十分痛心且相当浪费的行为，回收有价值的遗物和各种设备将有助于我们快速重建一批研究设施，以便于开展更多研究。" 
MIL_throw_old_can_get_new_desc: "虽说废墟之中存在着不少旧设备，但是有相当比例已经损坏亦或者是已经落后，这种情况下还是需要对其进行修理和更换的。除旧迎新是不可避免的事情，为了更好的建设，这是必要的代价。" 
MIL_Prepare_grand_festival_desc: "晄轮大祭作为整个基沃托斯最重要的活动之一，准备工作是万万不可马虎行事的，我们有必要对其进行专门的立项和准备工作，以防止出现乱子，当然，为晄轮大祭进行的种种投入在准备期间也并非毫无回报。" 
MIL_yuuka_unhappy_desc: "晄轮大祭的准备需要的资源可不是一笔小数目，如果是平时，千年负担这笔支出是完全没有问题的，但财政危机的余波使我们必须谨慎控制我们的支出，我们的研讨会会计优香同学恐怕得为此烦恼好长一阵子了。"
MIL_make_more_money_desc: "在财政危机的阴影下，我们不能贸然动用太多的预算，但当前所能动用的经费显然是不够的，那么我们就得从别的地方想想办法了"
MIL_make_more_money_effect_tooltip: "经费等级：§G+1§!（最高§Y5§!级）\n新的经费上限与每月恢复量将在下个月月更时生效，不会立即恢复当前经费。\n每级经费等级：\n生活消费品需求：§R+10%§!\n经费等级3/4/5：\n学生支持度每月变化：§R-1/-2/-4§!"
# 2026-06-01: 按原版动态修正变化文本风格重写晄轮大祭国策效果提示。
MIL_reduce_cost_effect_tooltip: "当前可用经费：§G+50§!\n解锁宣传决议：§Y勤俭节约，减少浪费§!"
MIL_need_help_effect_tooltip: "解锁与其他大型学园进行商业合作的决议。\n筹备晄轮大祭：\n生活消费品需求：§G-10%§!\n最终收益会按合作规模分给赞助学园。"
MIL_we_can_do_it_by_ourselves_effect_tooltip: "解锁宣传决议：§Y我们能做到§!\n学生支持度：§G+20%§!\n筹备晄轮大祭：\n稳定度：§G+5%§!\n学生支持度每月变化：§G+1§!\n只有完成该国策，才可能触发晄轮大祭大成功。"
MIL_opposition_hidden_in_the_dark_effect_tooltip: "解锁安保等级调整。"
MIL_The_power_of_Technology_effect_tooltip: "学生支持度：§G+10%§!\n解锁科技投入相关调整。"
MIL_noas_Strive_effect_tooltip: "筹备晄轮大祭：\n学生支持度每月变化：§G+1§!\n稳定度：§G+5%§!"
MIL_The_construction_work_is_in_full_swing_effect_tooltip: "稳定度：§G+10%§!\n学生支持度：§G+10%§!\n政治点数：§G+50§!\n科技等级月度经费恢复消耗优化为每级§R-3§!。\n解锁决议：§Y会场压力测试§!"
MIL_The_Increasingly_refined_preparations_effect_tooltip: "学生支持度：§G+15%§!\n政治点数：§G+50§!\n筹备晄轮大祭：\n生活消费品需求：§G-50%§!"
MIL_reduce_cost_desc: "财政危机对于晄轮大祭的准备无疑是造成了很大的影响，为了筹备晄轮大祭，我们得尽可能的减少不必要的支出了。" 
MIL_need_help_desc: "在难以腾出多余的预算的情况下，仅靠千年自己似乎难以承担举办晄轮大祭的巨大开支，也许我们应该和其他学院合作来分摊一下压力，尽管这将不可避免的意味着晄轮大祭的收益将会被分走一部分，但是这总比我们独自去做最终把事情搞砸了好。"
MIL_we_can_do_it_by_ourselves_desc: "假如我们一直束手束脚，我们永远也摆脱不了财政危机的阴影，准备晄轮大祭固然因为财政危机困难重重，但是这并不意味着我们需要对此妥协，这段时间的筹备工作证明，只靠千年自己也并非不能做好筹备工作。"
MIL_build_grand_festival_work_desc: "一切已经准备就绪，是时候让我们大干一场了。"
MIL_opposition_hidden_in_the_dark_desc: "虽然目前晄轮大祭的建设工作正在顺利进行，但是在学院中似乎有人对晄轮大祭颇有微词，我们需要尽快解决问题，以防出现意外情况。"
MIL_noas_Strive_desc: "研讨会书记官生盐诺亚显然更加擅长和学生们打交道，通过安抚对晄轮大祭建设不满的学生，一个更加团结的千年能够更好地完成建设工作。"
MIL_The_power_of_Technology_desc: "身为基沃托斯科研的引领者，筹办晄轮大祭怎么能藏着掖着呢，我们要将最新最好的科技用在建设工作之中，相信千年的学生们也会非常支持这一决定的。"
MIL_Let_go_all_out_desc: "废墟开发已经得到批准，施工队已经整装待发，开足马力，让我们大干一场。"
MIL_Unexpected_surprise_desc: "在废墟清理过程之中，我们意外发现了一批遗落的旧技术产物，其中仍有可以供我们借鉴参考之处，对其进行研究将有助于我们的科研进步。"
# 2026-07-17 修改：明确“意外惊喜”国策给予的两类科研突破点数。
MIL_Unexpected_surprise_effect_tt: "获得§G1§!点陆军科研突破点。\n获得§G1§!点空军科研突破点。"
MIL_it_not_normal_desc: "尽管研讨会预估到了可能会有意外发生，但是当下的情况依旧处于了研讨会意料之外，研讨会已经决定让安保部出动部队，清除任何意外因素。"
MIL_we_need_Strong_fight_desc: "袭击者的顽强令研讨会非常意外，鉴于废墟开发计划的重要性，安保部将会得到研讨会更大的授权，以必要的手段快速清理这些令人恼火的袭击者。"
MIL_we_have_achieved_initial_success_desc: "废墟开发初见成效"
# 2026-07-14 修改：补齐废墟开发国策中隐藏效果、刷兵编制及复杂资源结算的玩家可见提示。
MIL_ruins_great_game_restriction_tt: "在全部§Y4个旧校区废墟地块§!完成§Y清理废墟§!前，§Y千禧科技学园§!无法发起学园战术演习，也无法成为演习目标；正在进行或准备中的演习将立即终止。"
MIL_ruins_civilian_factory_donation_tt: "获得持续§Y365日§!的废墟开发民工捐赠：\n$MODIFIER_INDUSTRIAL_FACTORY_DONATIONS$：§G+10§!"
MIL_ruins_pin_holder_automech_reinforcement_tt: "在§Y$STATE_485$§!部署§G3个§!§Y废墟警戒自动机步兵师§!。\n每个师包含§Y6个$infantry_am$§!，以及§Y1个$recon$§!和§Y1个$engineer$§!，生成时满员且满装备。"
MIL_ruins_heavy_assault_mech_reinforcement_tt: "在§Y$STATE_485$§!部署§G1个§!§Y废墟重拳机甲部队§!。\n该师包含§Y5个$medium_bm_unit$§!、§Y5个$ifv_unit$§!，以及§Y1个$maintenance_company$§!、§Y1个$signal_company$§!和§Y1个$ifv_recon$§!，生成时满员且满装备。"
MIL_ruins_initial_success_resources_tt: "在两个已完成§Y基础设施重建§!且尚未获得本奖励的旧校区地块中，各增加：\n$state_resource_resources_el$：§G+8§!\n$state_resource_resources_cm$：§G+8§!"
MIL_no_debt_desc: "为了应对财务危机，研讨会经过慎重的讨论，拟定了债务清除计划，以将其彻底消除。"
MIL_New_incentive_plan_desc: "尽管千年大赏如今在千年内部已经颇具含金量，但是研讨会依旧认为千年学生们的潜力还有巨大的挖掘空间，也因此，全新的激励计划新鲜出炉，旨在推动学生们更加积极的进行发明与创造来推动千年的进步与发展。"
MIL_money_is_fire_desc: "为了配合激励计划，研讨会会计旱濑优香同学几乎是咬着牙同意了更多的经费用于此处，尽管知道这是用短期损失换取长远利益，但是我们的研讨会会计也因此更加严格的审计各个社团的成果与收益，她要尽最大可能保证，这些燃烧的经费每一分都花在了应该花的地方。"
MIL_big_view_desc: "千年大赏乃是千年内部每年一度的盛会，大量创新与成果将在此得到检验，其中有着巨大的潜在收益，善用这些成果足以让我们获取到能够填补整个空缺的资金。"
MIL_veritas_dream_desc: "尽管千年如今已经在自动化和信息化领域走在了整个基沃托斯的前列，但是真理部的学生们依旧认为，以现有的技术条件，千年可以做的更好，为此，她们提出了一个大胆的设想。"
MIL_Imaginary_number_plan_desc: "“虚数”计划，乃是真理部基于现有技术基础之上提出的一套全新的，规模巨大的网络管理系统，其将能够管理千年的方方面面，为研讨会提供最佳的辅助方案，如果能够完成，不仅研讨会的管理能力将会再上一层楼，并且在肉眼可见的未来，其都能为千年的进步与发展提供巨大的支持。"
MIL_difficult_development_task_desc: "由于千年已经有了一套正在使用的数据系统，为了全面超越它，“虚数”系统的预期是宏大而高效的，与之相对，开发难度也是直线上升。不过，真理部的诸位在这艰巨的任务面前并未退缩，他们信心满满，要征服这座看似高不可攀的雄峰。"
MIL_more_coffee_desc: "“虚数”系统的工程量意外地超出预期，尽管真理部的诸位拼尽全力，但是依旧离完成还有一段距离，也许，适当的休息才是真理部的同学们应该做的事情。"
MIL_software_and_hardware_desc: "“虚数”系统的建设不只需要软件开发，为了最大限度的发挥其作用，必要的硬件设施也是要跟上的，工程师部将承担这一任务，以最快的速度建设配套设施。"
MIL_efforts_of_the_Engineering_department_desc: "工程师部对于“虚数”系统的建设工作非常重视，她们以最快的速度开工，高效的施工有效的推动了“虚数”系统的建设工作，这有效节约了开发时间。"
MIL_best_internet_desc: "经过了长久的奋战，尽管我们遭遇了各种挫折和问题，但是在真理部的全力奋战以及其他社团的支持之下，“虚数”系统终于成功上线了，她的强大实力一经上线就得到了千年内部的认可，现在我们要做的，就是将整个千年的系统接入其中，并对其进行不断升级维护而已。“虚数”会做好一切交给她的工作的。"
MIL_i_think_it_can_desc: "工程师部是千年最重要的主力社团之一，她们的各种发明创造给千年带来了大量的进步与收益，在如今这个情况下，不论从何角度来说，支持工程师部进行更多更大胆的新技术开发都是没有坏处的。"
MIL_it_ugly_desc: "虽然千年的学生们并不怀疑工程师部的能力，但是考虑到大技霸们的思路有时候超脱寻常，为了打消其他人的怀疑，做出更多实践证明一下还是有必要的。"
MIL_but_useful_desc: "事实证明，工程师部的发明虽然偶尔会产生乱子，但是绝大部分怀疑的学生在试用之后都不得不承认一件事，那就是经过工程师部之手新加工和改装过的各种设备性能确实有很大提升，这也为更大程度的支持工程师部的工作扫清了障碍。"
MIL_Seminar_order_desc: "研讨会的订单"
MIL_our_product_is_best_desc: "“千年出品，必是精品”"
MIL_old_school_redevelopment_desc: "千年的废旧校区占据着千年大片的地区，这些区域不但阻碍了千年校区的进一步建设，还埋藏了大量隐患和危险，对其进行清理和重建再利用是一项势在必行的工作"
MIL_we_need_money_desc: "尽管财政危机尚未造成什么重大影响，但是为了学院的正常运行和给晄轮大祭的筹办扫平障碍，我们必须将其解决。"
MIL_The_construction_work_is_in_full_swing_desc: "大运动会的准备工作正在稳步推进，一切都在研讨会的计划之中，而进行运动会准备工作的学生们士气高昂，这使得准备效率得到了提高，也意味着研讨会能抽出更多资金用于大运动会的准备工作。"
MIL_The_Increasingly_refined_preparations_desc: "大运动会的准备工作日趋完善，对各种资源的需求也大多得到了满足，这意味着研讨会已经不必像之前一样投入大量资金进行建设，节约下来的资金可以用于他处。"
MIL_The_eve_of_the_grand_festival_desc: "如今，千年已经准备就绪，只待时日，我们便可迎来这一盛会的盛大开幕。"
MIL_The_beginning_of_the_carnival_desc: "虽然经历了一系列变故，但筹办工作还是有惊无险的完成了，这一基沃托斯的盛会已经正式开始，接下来，便是我们的狂欢时刻！"
MIL_The_beginning_of_the_carnival_trigger_tooltip: "当晄轮大祭开始时，自动完成该国策并结算结果。"
# 2026-06-01: 开幕国策效果提示改为默认白色，保持与晄轮大祭效果文本一致。
MIL_The_beginning_of_the_carnival_effect_tooltip: "获得持续§Y180§!天的§Y晄轮大祭进行时§!收益，并进入晄轮大祭结算。"
MIL_The_success_of_the_grand_festival_desc: "晄轮大祭的成功极大鼓舞了千年的学生们，不管从哪方面说，千年的学生们现在都是干劲十足。"
MIL_Hidden_Dreams_desc: "晄轮大祭的成功出乎了所有人的意料，上至研讨会，下至每一个普通千年学生都因此坚信，这次足以载进千年校史的里程碑事件会让千年进入一个前所未有的，崭新的发展时代，一个充满着梦想与希望的时代。"
MIL_Security_Committee_Defense_Reform_Plan_desc: "虽然基沃托斯依旧处于和平之中，但是近期在基沃托斯发生的事情令研讨会感到了令人不安的气息，也许千年必须开始重视起校园防卫事务了，而财政危机已经得到缓解的情况下，进行一次大刀阔斧的改革将毫无疑问得到研讨会强有力的支持。" 
MIL_Integrate_C_and_C_desc: "鉴于基沃托斯学生们普遍高于自动机的战斗力，研讨会在经过讨论后得出结论，建立一只规模较小却精锐的特殊学生部队是当前的重点，她们将装备有特制单兵机甲，并由原C&C成员直接负责训练。" 
MIL_noa_Concept_desc: "由于对整合完全没有经验，以及部门重组必然出现的混乱的影响，安保部的工作效率降低了不少，不过研讨会书记官生盐诺亚对相关的工作提供了大量的帮助，这极大的提高了安保部的工作效率。" 
MIL_The_three_rules_of_Yuuka_desc: "鉴于C&C在加入安保部之前的任务风格，为了安保部的经费不至于有过多的额外损耗，研讨会会计旱濑优香与C&C提前订立了一系列规定，在尽可能少影响C&C作战效率的同时尽可能多的减少不必要的支出。" 
MIL_Special_Forces_Training_Program_desc: "在结束了安保部重组带来的混乱之后，我们终于可以专注于特战生的训练计划了，相信在原属C&C的千年精锐们带领下，她们可以尽快成才。" 
MIL_Special_Forces_Exoskeleton_Development_desc: "常言道，“好刀用在刀刃上”，对于特战生亦是如此，训练是提高战斗力的一环，但是在此同时也要为她们配备一套趁手的装备，这样才能最大限度地发挥她们的战斗力。" 
# 2026-07-14 修改：特战线提示复用装备、修正与总动态修正的本地化名称，并按原版精度显示。
MIL_Special_Forces_Exoskeleton_Development_tt: "§Y$MIL_millennium_defense_force$§!追加效果：$MIL_mdf_special_equipment_effect_tt$"
MIL_Special_Forces_Hell_Training_tt: "§Y$MIL_millennium_defense_force$§!追加效果：\n$MODIFIER_SPECIAL_FORCES_TRAINING_TIME_FACTOR$：§R+10.0%§!\n$MODIFIER_SPECIAL_FORCES_CAP$：§G+10.0%§!\n$MODIFIER_TERRAIN_PENALTY_REDUCTION$：§G+10.0%§!"
MIL_Special_Forces_Hell_Training_Unique_tt: "§Y$MIL_millennium_defense_force$§!追加效果：\n$MODIFIER_SPECIAL_FORCES_ATTACK_FACTOR$：§G+10.0%§!\n$MODIFIER_SPECIAL_FORCES_DEFENCE_FACTOR$：§G+10.0%§!"
MIL_Special_Forces_Hell_Training_desc: "对于参与训练的大多数学生而言，C&C的训练课程都是一种地狱酷刑，这不仅仅是因为训练科目和强度都远超一般训练程度，还因为一些特别的原因，用其中一名特战生的话来说就是，“其他训练我都懂，可为什么会有女仆训练啊？”。"   
MIL_Special_Forces_Hell_Training_Unique_desc: "在C&C与安保部其他成员的共同努力之下，特战生培训计划非常顺利地完成了，研讨会相信，特战生们将成为千年手中的尖刀，让所有敢于危害千年的家伙付出应付的代价。" 
MIL_Mechanical_Built_High_Wall_desc: "千年的自动机技术已经相当先进，这是我们的优势之处，研讨会有理由相信，一支庞大而先进的自动机队伍足以应对一切安保部的工作需要。" 
MIL_Operating_System_Upgrade_desc: "虽然自动机技术已经成熟，但是这并不代表终点，自动机操作系统在实践中发现依旧有着可以优化的地方，这将有效提高自动机操作效率和操作上限，使其能更好地适应各种需求。" 
MIL_Card_Drawing_Time_desc: "想要制造更强大的机械，性能更好的材料必不可少，而材料学在某种意义上是一门充满了抽卡气息的学科，相信千年的才俊们能找到更好的材料来制造机甲和自动机，大概吧。" 
MIL_Automaton_Operation_Training_desc: "新系统需要时间适应，为了让安保部成员们尽快熟悉，针对性的训练是必不可少的。" 
MIL_Stronger_Firepower_Better_Protection_desc: "我们的技术水平已经允许我们对机甲和自动机进行更多的改造，千年的“大技霸”们将能够更多的发挥自己的奇思妙想来让这些机械变得更加强大，当然，“大技霸”们相信，研讨会会拨付所需的额外经费的。" 
MIL_Millennium_Steel_Wall_desc: "俗话说，质量不够，数量来凑，即使我们的自动机和机甲技术已经达到了一个比较先进的水平，但是比起学生部队依旧略有不足，然而，质量从来都不是机甲的优势，数量才是，我们将会用无穷无尽的机甲与自动机，来淹没所有敢于挑战千年的对手。" 
MIL_Reorganize_the_Security_Department_desc: "在以前，千年安保部被普通且繁忙的安保和治安工作所占据，虽然总体而言，她们干的还不错，但这显然已经无法适应新时代的防卫需求，随着这些工作得以被分配给其他部门，千年安保部将其重点转向了更需要技术含量和专业性的领域-自治区领空以及网络空间的防卫。以及全面统筹千年的防务工作。" 
MIL_Guard_the_Sky_of_a_Millennium_desc: "在科技如此发达的基沃托斯，可能对千年校园安全造成影响的不只是来着地面的因素，也要注意空中的威胁，并且，空地结合协同作战，才能得到更强大的战斗力。" 
MIL_Practical_Drone_Development_desc: "千年的技术储备无疑是非常雄厚的，而千年学生们的创造力也带来了大量可用的设计，但是先进的设计并不等于强大的战斗力，我们需要更加脚踏实地和成熟的装备来保证安保部空中力量的可靠。" 
MIL_Silent_Hunter_desc: "千年的先进技术让我们的空中力量拥有了更加隐蔽，更加精准的打击方式，这使得经过训练的安保部成员们可以在对手难以察觉的情况下对其发动意想不到的攻击，从而极大提高作战效率。" 
MIL_Small_Scale_Air_Tactics_desc: "安保部的无人机操作人员由于长久没什么任务，操作能力大都出现了不同程度的下滑，进行一些小规模的训练与推演是恢复战斗力的最快捷方式。" 
MIL_Eagle_Strike_Exercise_desc: "仅仅只是小规模的战术推演是远远不够的，为了进一步提高我们的空中战斗力，安保部在得到研讨会批准的情况下将开展“鹰击长空”对抗演习，这回是一场大规模的模拟对抗，将会从各种方面来模拟一切安保部可能遇见的情况，研讨会相信，这场演习将会极大的提高安保部的空中战斗力。" 
MIL_Soaring_Sky_Eagle_desc: "千年的空中力量已经得到了重新恢复并进行大规模发展，我们有信心在空中击败任何敢与千年为敌之人，就像展翅欲飞的雄鹰一般。" 
MIL_Invisible_Defense_Line_desc: "在网络如此发达的基沃托斯，有很多不怀好意之人对千年的各种重要机密抱有不切实际的幻想，因此，虽然我们的网络技术独树一帜，但是依旧不可掉以轻心。" 
MIL_Information_Security_desc: "信息安全是学院稳固的根本，倘若学院的信息发生不该有的泄露，只会给学院的安全与稳定带来不必要的麻烦。" 
MIL_Millennium_Student_Information_System_desc: "在研讨会会计体重100kg的谣言传出之后，学生信息系统的漏洞被真理部发现，因此，在研讨会的要求下，真理部全面提高了信息系统的网络防御标准，以确保不会再发生类似事件。" 
MIL_Networked_Weapons_desc: "从网络上对对手进行攻击，是一种事半功倍的办法，为了保证千年的安全，真理部的黑客技术也是不可或缺的一环。" 
MIL_Networked_Weapons_Necessary_desc: "或许网络武器的使用确实会导致一些难以预料的后果，但是，我们不能因此就自废武功放弃对其的研究，主动放弃只会导致我们在面对攻击之时毫无还手之力。" 
MIL_Impenetrable_Defense_Line_desc: "在真理部和安保部的合作下，千年校园网络的漏洞得以修补，一道强大的防御屏障已经建立，这道无形防线将为千年的网络安全提供足够安全的保障，阻止任何试图以网络威胁千年安全的想法。"
MIL_Millennium_Stability_Guardian_desc: "如今的安保部已经脱胎换骨，精锐的成员，先进的装备，优秀的战术，多种成果之下是安保部战斗力的全面提升。在此基础上，安保部有信心，更有能力，去应对千年的一切治安问题和外来威胁。"


# MIL_new_blueprint_award_bonus_desc: "摆脱财政危机后的研讨会重新整理了千年大赏的成果转化流程。更清晰的预算分配、更高效的产业对接和更稳定的评审制度，正在把学生们的发明创造转化为学院长期发展的动力。"
MIL_new_development_plan_award_bonus_tooltip: "§Y$MIL_Millennium_Award$§!追加效果：\n建造速度：§G+5.0%§!\n工厂产出：§G+5.0%§!\n生产效率上限：§G+5.0%§!\n生产效率增长：§G+5.0%§!"
MIL_new_development_plan_award_mission_tooltip: "立即完整结算一次以下§Y千年大赏§!循环项目，并分别开始下一轮：\n§Y升级“虚数”系统§!\n§Y工程师部的新发明§!\n§Y游戏开发部的新游开发§!"
MIL_mobile_construction_technology: "机动建设技术"
MIL_mobile_construction_technology_1_desc: "工程师部与真理部联合整理出的机动建设技术，正在让千年的施工体系摆脱传统流程的束缚。\n\n当前阶段：§Y技术推广§!"
MIL_mobile_construction_technology_2_desc: "随着机动建设技术大规模铺开，前期研发与部署成本被逐渐摊薄，千年能够以更低的资源压力推动更多建设项目。\n\n当前阶段：§Y规模应用§!"
MIL_mobile_construction_technology_3_desc: "新式建设材料、结构监测设备和自动维护流程已经纳入机动建设技术体系，千年的重要设施因此更不容易在突发打击中停摆。\n\n当前阶段：§Y质量保障§!"
MIL_second_millennium_tower: "第二座千年巨塔"
MIL_second_millennium_tower_desc: "第二座千年巨塔已经正式开工。庞大的建设预算带来了不小压力，但这座建筑将成为千年未来科研与产业体系的重要支点。"
MIL_second_millennium_tower_1_desc: "第二座千年巨塔已经正式开工。庞大的建设预算带来了不小压力，但这座建筑将成为千年未来科研与产业体系的重要支点。"
MIL_second_millennium_tower_mid_project: "巨塔中期工程"
MIL_second_millennium_tower_mid_project_desc: "巨塔的中期工程已经完成，一部分配套区域开始承担科研、管理与实验任务。建设项目正在从单纯消耗转化为实际回报。"
MIL_second_millennium_tower_2_desc: "巨塔的中期工程已经完成，一部分配套区域开始承担科研、管理与实验任务。建设项目正在从单纯消耗转化为实际回报。"
MIL_second_millennium_tower_research_equipment: "巨塔科研设备"
MIL_second_millennium_tower_research_equipment_desc: "新式科研设备陆续入驻巨塔配套区域。它们不仅能改善实验条件，也能把更多技术成果推向稳定生产。"
MIL_second_millennium_tower_3_desc: "新式科研设备陆续入驻巨塔配套区域。它们不仅能改善实验条件，也能把更多技术成果推向稳定生产。"
MIL_second_millennium_tower_experimental_environment: "巨塔实验环境"
MIL_second_millennium_tower_experimental_environment_desc: "巨塔周边的实验区已经成形，良好的空间规划、自动调度与安全管控让学生们可以更专注地投入研究。"
MIL_second_millennium_tower_4_desc: "巨塔周边的实验区已经成形，良好的空间规划、自动调度与安全管控让学生们可以更专注地投入研究。"
MIL_nearly_completed_second_millennium_tower: "即将完工的巨塔"
MIL_nearly_completed_second_millennium_tower_desc: "第二座千年巨塔已经接近完工。持续已久的建设压力终于开始消退，而它所带来的科研和组织收益也愈发清晰。"
MIL_second_millennium_tower_5_desc: "第二座千年巨塔已经接近完工。持续已久的建设压力终于开始消退，而它所带来的科研和组织收益也愈发清晰。"
MIL_millennium_students_wisdom_crystallization: "千年学生的智慧结晶"
MIL_millennium_students_wisdom_crystallization_desc: "第二座千年巨塔正式宣告落成。它不仅是一座建筑，更是千年学生共同完成的时代成果，象征着学院在科研、建设与产业组织上的全新高度。"

MIL_reform_1_t: "改革的方向"
MIL_reform_1_desc: "研讨会需要决定安保部防卫改革的优先方向。是优先整合C&C建立精锐特战部队，还是优先发展自动机技术建立机械化部队？"

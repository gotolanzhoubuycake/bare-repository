l_simp_chinese:
# 2026-08-03: 统一千年本地化键值为顶层格式，按国家理念与修正分组维护。
 MIL_Millennium_Award: "千年大赏"
 MIL_Millennium_Award_desc: "千年大赏汇总了千年各研发部门取得的长期成果，并将已经投入实际应用的技术转化为持续收益。"
 MIL_Game_Development_Department_Game_Development: "新游热度"
 MIL_Game_Development_Department_Game_Development_desc: "游戏开发部近期作品带来的关注将在120日内提高政治点数获取；若新作大受欢迎，还会在此期间提高稳定度。"
 MIL_award_imaginary_number_network_more_money_penalty: "虚数升级追加经费"
 MIL_award_imaginary_number_network_more_money_penalty_desc: "为了加快虚数系统升级，研讨会正在承担额外研发经费。"
 MIL_award_imaginary_number_network_more_people_penalty: "虚数升级人员调配"
 MIL_award_imaginary_number_network_more_people_penalty_desc: "更多研究人员被临时调往虚数系统升级项目。"
 MIL_award_engineer_department_more_money_penalty: "工程师部追加经费"
 MIL_award_engineer_department_more_money_penalty_desc: "为了加快新发明开发，研讨会正在承担额外研发经费。"
 MIL_award_engineer_department_more_people_penalty: "工程师部人员调配"
 MIL_award_engineer_department_more_people_penalty_desc: "更多研究人员被临时调往工程师部的新发明项目。"
 MIL_award_game_development_propaganda_penalty: "新游宣传经费"
 MIL_award_game_development_propaganda_penalty_desc: "研讨会正在为游戏开发部的新作承担额外宣传开支。"
 MIL_award_game_development_test_penalty: "试玩版本反馈整理"
 MIL_award_game_development_test_penalty_desc: "研讨会正在抽调行政资源整理试玩版本反馈。"
 MIL_place_of_pursuing_truth: "追求真理之处"
 MIL_place_of_pursuing_truth_desc: "千年科技学院，最初乃是一群想要探求基沃托斯七大未解之谜的学生聚集在此所创立的学院。从那时开始，千年一步一步发展至今，追求真理与进步的精神从未改变。而也是因为对真理与科技进步的狂热追求，千年的学生们对科技进步与个人兴趣之外的事情大多漠不关心，然而这依旧改变不了千年科技学院在基沃托斯影响力愈发壮大的事实。"
 MIL_security_department_of_long_peace: "承平日久的安保部"
 MIL_security_department_of_long_peace_desc: "由于千年的学生们在科研活动之外大多安分守己，千年本身也与其他学院没有什么冲突，安保部作为学院治安部门实际上已经很久没有过实质性的任务了。以至于安保部虽然可以得到千年的高科技装备支援，但是不管是在地面还是天空中，实际战斗力却羸弱不堪。与此同时，长久的和平状态也让安保部对增加战斗力的尝试兴致缺缺，如果不进行改革，新式战术和装备都难以推广。"
 MIL_overly_advanced_aircraft: "过于前卫的飞行器"
 MIL_overly_advanced_aircraft_desc: "由于千年学生们过于大胆的创新精神和实践能力，安保部使用的飞行器里充满了各种看似先进但是实用性十分堪忧的设备，这不仅极大的限制了安保部空中力量的战斗力，还导致我们不得不支出额外的财力来维护和制造它们。"
 MIL_overly_advanced_aircraft_reviewed: "初步审查的飞行器设计"
 MIL_overly_advanced_aircraft_reviewed_desc: "安保部已经完成对现役飞行器方案的初步审查。部分过度实验化的设计被纳入统一标准，维护压力有所缓和，但千年空中力量的最终路线仍有待决定。"
 MIL_overly_advanced_aircraft_practical_1: "规范化飞行器设计"
 MIL_overly_advanced_aircraft_practical_1_desc: "安保部已经开始收束过于发散的飞行器设计方案。统一接口、标准化航电和更清晰的维护流程正在让千年无人机逐渐摆脱难以量产的困境。"
 MIL_practical_aircraft_system: "实用化飞行器体系"
 MIL_practical_aircraft_system_desc: "经过系统化审查，千年的飞行器设计终于在性能、成本与维护之间取得了更可靠的平衡。这套体系不会追逐每一个炫目的新想法，但它能让安保部真正稳定地掌握天空。"
 MIL_overly_advanced_aircraft_vanguard_1: "实验规格飞行器"
 MIL_overly_advanced_aircraft_vanguard_1_desc: "安保部选择保留那些高风险、高维护压力的实验规格。它们依然昂贵，也依然挑剔，但在合适的战场环境下，这些前卫设计能够爆发出常规机体难以企及的性能。"
 MIL_vanguard_aircraft_system: "前卫飞行器体系"
 MIL_vanguard_aircraft_system_desc: "千年没有放弃自己的技术野心，而是将其推向了真正能够参战的高性能平台。维护账单依然刺眼，生产线也承受着巨大压力，但这些飞行器会用战场表现证明它们为何值得这样的代价。"
 MIL_shadow_of_financial_crisis: "财政危机的阴云"
 MIL_shadow_of_financial_crisis_desc: "由于尚不清楚的原因，研讨会会计旱濑优香同学发现研讨会经费出现了极其巨大的漏洞。尽管目前以千年的雄厚财力尚可支撑，但如果不尽快找到是哪里出了问题，晄轮大祭这个投资巨大的项目变无从谈起，而一旦有其他意外打破了资金链，后果将不堪设想。"

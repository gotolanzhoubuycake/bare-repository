# 2026-07-18 修改：废墟敌情分析结果。
 MIL_ruins_intel.1.t: "情报汇总：废墟钢盔团"
 MIL_ruins_intel.1.d: "交火记录和俘获的通讯设备表明，袭击者是一支长期盘踞在旧校区外围的钢盔团。她们熟悉废墟中的通路和掩体，但其装备与行动方式仍属于常规武装力量。"
 MIL_ruins_intel.2.t: "情报汇总：暴走机械"
 MIL_ruins_intel.2.d: "工程师部确认，袭击者是大批失去控制的自动机械。它们没有正常的指挥体系，却会持续执行残缺的巡逻与攻击指令。"
 MIL_ruins_intel.3.t: "情报汇总：十字神明"
 MIL_ruins_intel.3.d: "现有资料无法用常规武装或失控机械解释这些袭击者。真理部将其暂定名为十字神明，并建议安保部按最高威胁等级处理。"
 MIL_ruins_intel.a: "情报已经足够明确"

# 2026-07-18 修改：战后解析结果。
 MIL_ruins_reward.1.t: "工程师部的解析结果：研究资料"
 MIL_ruins_reward.1.d: "损坏器械中保存着一批仍可读取的设计与实验记录。整理这些资料将暂时加快千年的整体科研进度。"
 MIL_ruins_reward.2.t: "工程师部的解析结果：施工结构"
 MIL_ruins_reward.2.d: "残骸中的模块化结构适合转用于工程设备。工程师部已经将相关方案交给负责废墟重建的施工队。"
 MIL_ruins_reward.3.t: "工程师部的解析结果：作战结构"
 MIL_ruins_reward.3.d: "对驱动和控制结构的复原揭示了新的机械作战方案，可用于改进千年的自动机与战斗机甲。"
 MIL_ruins_reward.4.t: "工程师部的解析结果：生产工艺"
 MIL_ruins_reward.4.d: "部分零件采用了更便于批量生产的设计。工程师部已经整理出可以直接应用于现有生产线的改进方案。"
 MIL_ruins_reward.5.t: "从钢盔团处获得的意外收获"
 MIL_ruins_reward.5.d: "审问和缴获资料已经整理完毕。安保部获得了一批可用于军事研究的经验，专项研究团队也从中找到了新的工程线索。"
 MIL_ruins_reward.6.t: "十字神明线索解析完成"
 MIL_ruins_reward.6.d: "真理部完成了对异常资料的第一轮整理。这些线索将同时推动常规科研、神秘科技和欧帕兹相关特殊项目。"
 MIL_ruins_reward.a: "把成果投入后续研究"

# 2026-07-18 修改：SPTF废墟调查事件链。
 MIL_ruins_story.1.t: "Hub被骇入！"
 MIL_ruins_story.1.d: "工程队接入旧校区网络节点后，施工Hub立即遭到不明程序入侵。自动调度、道路测绘和基础设施施工全部被迫暂停，真理部正在追踪入侵来源。"
 MIL_ruins_story.1.a: "先隔离受影响的系统"
 MIL_ruins_story.2.t: "成立SPTF"
 MIL_ruins_story.2.d: "零散的异常记录表明，旧校区中仍有多个相互关联的未知目标。研讨会批准成立专门调查小组SPTF，负责继续追查这些线索。"
 MIL_ruins_story.2.a: "调查正式开始"
 MIL_ruins_story.3.t: "追查比娜"
 MIL_ruins_story.3.d: "SPTF根据Hub留下的访问记录追踪到了名为比娜的目标。调查过程提供了宝贵的废墟作战经验，但目标本身仍未完全查明。"
 MIL_ruins_story.3.a: "整理这次行动的记录"
 MIL_ruins_story.4.t: "追查切赛德"
 MIL_ruins_story.4.d: "新的数据将调查引向了代号切赛德的目标。安保部与调查小组在废墟中的联合行动进一步积累了应对异常威胁的经验。"
 MIL_ruins_story.4.a: "继续追查剩余线索"
 MIL_ruins_story.5.t: "探索漫水城区"
 MIL_ruins_story.5.d: "调查记录最终指向了漫水城区。积水、断裂道路和失效设施让搜索十分困难，但小组仍在深处发现了与此前目标相同来源的痕迹。"
 MIL_ruins_story.5.a: "答案已经很接近了"
 MIL_ruins_story.6.t: "十字神名的真相？"
 MIL_ruins_story.6.d: "SPTF完成了对现有线索的汇总。比娜、切赛德和漫水城区中的异常痕迹都指向同一个尚无法完全解释的体系。调查组将其记录为十字神名，并把全部资料移交研讨会。"
 MIL_ruins_story.6.a: "这项调查才刚刚开始"

 MIL_cae_war.6.t: "凯撒的突然袭击"
 MIL_cae_war.6.d: "凯撒的突然袭击"
 MIL_cae_war.6.a: "正义必将胜利"

### 战后事件 ###
# 事件10：光辉的胜利
 MIL_cae_war.10.t: "光辉的胜利"
 MIL_cae_war.10.d: "在千年全体学生的不懈抗争之下，即使是强如凯撒，也无法动摇千年分毫，任何试图倾覆千年的邪恶想法都将被千年学生的抗争而粉碎。而具体到这场战争，我们为奋战在战斗一线的安保部成员和抵抗组织成员们的战果而骄傲，是他们在最前方抵挡了敌人的攻击，并以凌厉的反击摧毁了敌人的抵抗；为身处沦陷区但毫不妥协坚持抗击侵略者的学生和自治区市民们感到自豪，他们虽被迫留在沦陷区，但是却没有因此气馁，反而从敌人内部对敌人造成了巨大了损失，为正面战线的胜利做出了不可磨灭的贡献；为在后勤战线上那些默默无闻却加班加点不求回报生产各种物资的学生们表示敬意,她们单个人的力量或许很小，小到不值一提，但是当这些点点滴滴汇聚到一起，却爆发出了所有人都意想不到的生产力，为前线提供了远超预期的供给，让奋战在前线的同窗们能够毫无后顾之忧，全力以赴击退敌人。而更重要的是，在每一个千年人的不懈努力之下，我们守护住了我们美丽的校园，我们没有让千年的旗帜因我们而蒙羞，欢呼吧，为团结在这面光辉旗帜之下抗击无耻资本的每一个人而欢庆胜利！让整个基沃托斯为我们的成就而欢呼！"
 MIL_cae_war.10.a: "千年旗帜永不落！"

# 事件11：审判战犯
 MIL_cae_war.11.t: "审判战犯"
 MIL_cae_war.11.d: "战争已经结束，但正义的审判才刚刚开始。那些在战争中犯下罪行的凯撒集团成员必须为他们的所作所为付出代价，千年将组织公开审判，让所有人都看到，任何胆敢侵犯千年的人都不会逃脱应有的惩罚。"
 MIL_cae_war.11.a: "正义不会缺席"

# 事件12：凯撒集团大解体
 MIL_cae_war.12.t: "凯撒集团大解体"
 MIL_cae_war.12.d: "凯撒集团，一个在基沃托斯足以称得上无处不在的庞然大物，即使是会长尚在时的联邦学生会，也得对其礼让三分，在非常久的时间里，没人会想到，这样一个巨无霸企业会有遭受崩溃的一天。然而，让所有人都没想到的是，这一天来的如此之快。入侵千年的失败，令凯撒集团遭受了前所未有的巨大损失，现任理事会直接陷入了崩溃状态。而此刻唯一能稳定局面的凯撒总裁在千年安保部攻入凯撒总部之后试图逃跑，但是其却只穿着睡衣在凯撒总部花园的假山中被安保部成员捉拿归案，千年学院随即宣布接管该地区的管理工作，并与诸多凯撒子公司展开了谈判，很显然，面对经济军事上的双重失败，凯撒集团已经输光了自己可用的全部筹码，面对一盘散沙且刚刚遭受重创的凯撒子公司们，千年学院研讨会在谈判中大获全胜，几乎达成了预定的所有目标，双方在残破的凯撒总部大楼前签订了停战协定，根据协定的要求，凯撒集团将被肢解，而研讨会会主导这一过程，千年安保部则会确保没有任何凯撒集团成员能够违反这一协定，并确保千年能够在这个过程中拿到自己应得的赔偿。\n\n即使是利维坦，也终有因自己过错而鲸落的一天。"
 MIL_cae_war.12.a: "凯撒的时代结束了"


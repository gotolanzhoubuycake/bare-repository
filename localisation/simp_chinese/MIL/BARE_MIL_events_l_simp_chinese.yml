# 2026-05-20: 晄轮大祭国策专属剧情事件占位文本，正式文本后续补充
 MIL_sport_event.70.t: "不测风云"
 MIL_sport_event.70.d: "“呼，这应该就是最后一份了吧？”诺亚在文件下方签好名字，随即起身伸了个大大的懒腰。近来为了筹备晄轮大祭，研讨会的工作量直线上升，熬夜加班也是常有的事——譬如现在，时钟显示现在已经是晚上十一点了。\n正当她开始收拾桌面，想着赶紧回家洗个热水澡然后睡觉时，门突然被急促地敲响了。\n“诺亚，诺亚！你还在吗！”\n诺亚认得声音的主人，那是最近同样忙个不停的优香。不过，自己不是吩咐她提前回去，细枝末节的收尾工作交给自己就好了吗？\n抱着疑问，她还是打开了门。令她吃惊的是，优香显然是一路跑过来的，毕竟她现在还在不停地大喘气。\n“小优香，这是怎么了？什么事能让你这么着急呢？”来不及多想，诺亚还是扶着优香进了屋，随即又给她倒了杯开水。“你看起来累坏了，先喝口水歇歇吧？”\n优香也没客气，接过来一饮而尽。“我就直说了吧，诺亚，你还记得晄轮大祭会场里那些应援机器人吗？”\n“哦...你是说应援机器人被黑客攻击的事情吗？”诺亚稍微思考了一会儿，“我记得【真理部】的同学不是已经开始追查攻击来源了吗？估计很快就能找到犯人了吧。”\n我想说的就是这个，诺亚...虽然很突然，但我们的时间不多了，事情开始往奇怪的方向发展了。”没等诺亚反应过来，优香便把一个U盘插到了电脑上，在三两下操作后播放了一段视频：那是会场地区的监控录像。画面里，机器人们诡异的齐刷刷绕着跑道走，一边还播放着更惊人的音频：\n“终止晄轮大祭！奖牌不能当饭吃！”“我们要看炊事员，不是运动员！”“早濑优香！生盐诺亚！研讨会的经费就用来干这个？”......\n看到这里，面面相觑的两人脸色都很难看，就像吃饭时吃出了苍蝇一样。“优香，你说的对。幕后黑手已经不只是反对晄轮大祭本身了，她们肯定还有更大的阴谋...”\n“但愿【真理部】的同学们动作能在快一些吧，抢在一切无可挽回之前...”优香仿佛失去了全身的力气，瘫坐在一旁的办公椅上。\n至于诺亚，她只是站在原地、一言不发。事到如今，她满脑子都在想一件事："
 MIL_sport_event.70.a: "“这场暴风雨，还会变得更猛烈吗？”"
 MIL_sport_event.71.t: "书记官的讲话"
 MIL_sport_event.71.d: "“歌原同学，请问广播设备目前状态如何？”诺亚向广播室里对着播音台捣鼓的歌原询问。\n“好了，诺亚书记官，设备确认一切正常！”歌原擦了把汗。“时间好像差不多了，接下来就交给您了！”\n“嗯嗯，非常感谢！”\n诺亚做了次深呼吸，攥紧演讲稿走到了播音台的麦克风前。此次晄轮大祭的举办，一度遇到部分学生的反对。好在最后，她还是成功说服了这些异见者们，让她们相信：举办一场出色的晄轮大祭，不仅是可能的，更是应该的。\n不过，这样还不够。必须更进一步让同学们认识到，团结对于千年未来发展的重要意义。\n“各位千年学园的同学们，你们好。我是「研讨会」的书记官生盐诺亚。”在做足准备后，诺亚正式开始了演讲。\n“相信这些天，大家都知道了：对于晄轮大祭的举办与否，我们内部出现了不小的分歧。有许多同学表示：目前千年的财政状况不佳，为什么还要砸钱去办一场看热闹的比赛？”\n“对于这样的观点，我可以理解，但也请允许我向大家阐述自己的意见。晄轮大祭并非普通的运动比赛，它是一场团结全体基沃托斯学生的聚会，是每位选手享受青春、追逐未来的舞台。诚然，信念与羁绊无法立即变现为牛奶与面包。但它可以指引我们攻坚克难，建设一个更美好的千年——到那时，所有学生都将过上更美好的生活。”\n“最后，请允许我引用一句山海经的谚语：道阻且长，行则将至。即使我们如今的处境不算乐观，但我们还有彼此，还有可以团结奋斗的伙伴。只要我们齐下一条心，找到大家梦想的最大公约数，我们就一定能走上最美好的前途，我们就一定能创造奇迹。”\n“希望我的这番话能对同学们有所启发，谢谢。”"
 MIL_sport_event.71.a: "表现真不错，诺亚书记官！"
 MIL_sport_event.72.t: "意料之外的紧急状况"
 MIL_sport_event.72.d: "晄轮大祭前夜出现了需要研讨会立刻处理的紧急状况。"
 MIL_sport_event.72.a: "立刻处理"
 MIL_sport_event.73.t: "晄轮大祭正式开幕！"
 MIL_sport_event.73.d: "“呼，呼...”看着台下的人山人海，绫音的内心十分忐忑。尽管被选为了宣誓代表，但她是第一次面对如此多的学生（尽管时间还是清晨）。不过，为了能够好好表现，她已经联系了很多次。所以...应该不会出问题吧？\n“没有必要这么紧张哦，奥空同学？”绫音转头看去，原来是花子，另一位宣誓代表在说话。\n“花子同学真厉害啊...”绫音内心充满了敬佩，“不愧是来自高尚的圣三一呢，明明在大家面前还能做到如此堂堂正正...”\n终于，宣誓环节开始了，两人开始一同宣读誓词：\n“作为选手们的代表，我宣誓！”\n“作为选手们的代表，我宣誓~”\n“我们作为晄轮大会的参加者...”\n“我们作为晄轮大会的参加者...”\n“堂堂正正地遵守体育精神...”\n“向【真实的欲望】发誓...”\n专注的绫音一时还没有反应过来哪里不对劲：“全身心地投入每一项比赛...”\n而花子也是很自然地宣读魔改版的誓词：“全身心地投入于【身体的对话】...”\n“啊...啊？”这下绫音终于发现问题了。“花子同学，你刚才说的到底是...？”\n“唔呼呼，我不是说过了吗？”花子表现得十分轻松，仿佛在讨论天气一般。“不要在意别人的眼光，坦率地表达自己的心情，就是这样哦。”\n无视周边已经瞠目结舌的绫音和观众们，花子继续发表着惊世言论：“晄轮大祭，是各个学园的学生放下武器，互相碰撞彼此的肌肤，加深亲密交往的友爱场所...”\n“换句话说...不就跟○○一样吗？”\n此言一出，全场哗然。而台下的工作人员们已经气炸了：\n“她知不知道自己在说什么啊？！立刻让她从台上下来！”\n“圣三一到底是怎么想的，居然让这种人当学生代表！”"
 MIL_sport_event.73.a: "至少开场令人印象深刻，不是吗？"

# 2026-07-17 修改：补齐废墟开发“意外收获”四类事件和随机奖励提示。
 MIL_ruins_surprise.1.t: "发现旧仓库"
 MIL_ruins_surprise.1.d: "工程队在清理封闭建筑时发现了一座保存尚可的旧仓库。仓库中的登记资料早已遗失，但仍有一部分原料和装备可以立即投入使用。"
 MIL_ruins_surprise.1.a: "把能用的东西全部清点出来"
 MIL_ruins_surprise_old_warehouse_tt: "随机获得以下奖励之一：\n在当前地块增加§G8§!点随机资源\n获得§G3000§!单位$infantry_equipment$\n获得§G750§!单位$support_equipment$\n获得§G200§!单位$light_fire_support_equipment$"
 MIL_ruins_surprise.2.t: "发现旧生产线"
 MIL_ruins_surprise.2.d: "一处被瓦砾封闭的生产区域比预想中保存得更好。虽然原有厂房已经无法直接恢复，但其中完整的设备、备件和技术资料足以帮助千年重新组织一条生产线。"
 MIL_ruins_surprise.2.a: "把这条生产线重新利用起来"
 MIL_ruins_surprise_old_production_line_tt: "随机获得§G1§!座地图外$industrial_complex$或§G1§!座地图外$arms_factory$。"
 MIL_ruins_surprise.3.t: "发现旧遗物"
 MIL_ruins_surprise.3.d: "工程队从废墟深处回收了一批具有纪念意义的旧校区遗物。它们既能用于学院展览和研究，也能证明废墟开发计划正在找回千年被遗忘的历史。"
 MIL_ruins_surprise.3.a: "这也是千年历史的一部分"
 MIL_ruins_surprise_old_relic_tt: "随机获得§G100§!政治点数或§G5%§!稳定度。"
 MIL_ruins_surprise.4.t: "发现旧科研设施"
 MIL_ruins_surprise.4.d: "工程队意外进入了一处封存多年的旧科研设施。大部分设备已经无法启动，但残留的实验记录、样品和数据仍有很高的研究价值。"
 MIL_ruins_surprise.4.a: "立即组织人员进行整理"
 MIL_ruins_surprise_old_research_facility_tt: "获得持续§Y180日§!的民族精神§Y$MIL_ruins_old_research_facility$§!：\n$MODIFIER_RESEARCH_SPEED_FACTOR$：§G+5.0%§!"


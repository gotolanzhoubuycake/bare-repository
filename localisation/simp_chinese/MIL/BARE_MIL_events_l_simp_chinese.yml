 MIL_event.3.t: "干劲十足的真理部"
 MIL_event.3.d: "早濑优香的小皮靴扣响地板的声音回荡在大清早的千禧年之塔。\n\n自开发“虚数”系统的任务委托给真理部以来，传来的好消息似乎只有她们充满着信心。研讨会能够理解任务的艰巨，但开发进度的监管还是不能少的。所以，作为监管和支援，优香在今天清早来到了真理部。\n\n“千寻，早上好。”“早安，优香。”迈进真理部，各务千寻迎了上来，“正好，大家都已经到齐了，正在开展日常的首项工作……”“什么？”优香大为惊讶，现在离开工时间还早，她没想到真理部的同学竟如此积极，不甘落后的她立即要求为自己也分派任务。\n\n可千寻只是表情异样地摇了摇头，带着她走进研发大厅。真理部的同学们正围在大厅中央的音濑小玉身前，神情严肃。小玉表情凝重地在人员名单上填着数字，一笔一划都举轻若重，周遭的气氛让优香也不由自主地紧张了起来。\n\n终于，小玉在最后一个名字后填上了数字，实验室中顿时爆发出一阵欢呼，大家都露出了如释重负般满意的笑容，在这一片其乐融融中，唯有优香一脸茫然。\n\n“你们……在干什么？”\n\n“哦，优香来了？早上好！”小涂真纪热情地向优香打招呼。\n\n“我们在分配今天的极限魔力，也有你的一份哦～”小玉回头看向优香，显然刚写的数字代表每人分配的箱数。\n\n“这是我们每天的第一项工作。”小钩晴补充道，“也是最重要的。”\n\n“所以……你们日常的第一项工作……只是为了……分配极限魔力？”\n\n难以置信的话从自己嘴中说出，可是真理部的同学们却不约而同地点了点头，张张笑脸好像在对优香说：你以为呢？恍然之间，优香只觉得自己和真理部的同学们一定是疯了一个。\n\n“万事开头难。”各务千寻拍了拍早濑优香的肩，“既然开头的困难已经解决了，看来咱们今天会很顺利……”千寻的脸上带着些许无奈，但她似乎已经习惯了这项工作……或者说是仪式。\n\n优香觉得只要自己能够理解这个仪式存在的意义，那么今天发生什么对自己而言都不再会是个困难……\n\n“好了，姑娘们，把各自的极限魔力领走。”千寻拍了拍手，大声说道，“然后我们开始工作！”回应着她的是充满自信与干劲的异口同声："
 MIL_event.3.a: "“是，部长——！”"
 MIL_event.4.t: "筋疲力尽的真理部"
 MIL_event.4.d: "昏暗的房间被电子仪器的冷光覆盖，不时传来的滴答声响与断断续续的键盘敲击声混在一起。忽然，一阵强光从门的方向亮起。\n\n优香在数次通过讯息联系无果后来到了真理部的活动室，数次轻轻敲门后，门居然自己打开了。略带刺激性的牛磺酸与微微酸涩的咖啡气息扑面而来。三张被屏幕照亮的脸即便不开灯细看，眼神中的呆滞和疲惫感也宛如实质一般沉重，令人畏惧。\n\n一声轻轻的叹息后，优香按下门口的电灯开关，走到窗边一把拉开窗帘。整个活动室诡异平衡带来的平静被这意料之外的阳光打破，真理部三人就像骤然接触到阳光的吸血鬼一般哀嚎着。\n\n等到声音渐渐平缓下来，三人或趴在桌上，或躺倒在椅子上，形态各异。\n\n“咳咳，所以你们又熬大夜？”\n\n听到优香的话，真纪的左手竖着大拇指，从椅背的遮挡下慢慢升起：“就差一点点……一点……点……”\n\n“是这样的……”趴在桌上的小玉嘴巴几乎没有动作，仿佛是从灵魂中飘出的语句一般。\n\n优香扶额片刻后，三人把椅子都转了过来，在她震惊的目光中，顶着厚厚黑眼圈的三人兴奋地向她讲解着有关“虚数”系统的突破性进展。\n\n自从接到任务开始，真理部的进展一直不太顺利。不同于传统大型操作系统，“虚数”系统的目标与绝大多数常见大型系统的需求堪称迥异，几乎无法找到可以作为参考的构筑思路——直到她们接到一封莫名出现在电脑里的神秘邮件，事情才出现转机。\n\n这封来自一位自称至高无上之机械神明的发信者的邮件附上了一大批模棱两可的代码。从原理上来说，它们似乎专为某种超大型智能机器集群服务，几乎无法在已有的任何计算机或程序上运行。但在对这些奇怪程序的脑内推演过程中，她们得到了巨大的启发。三人几乎忘了昼夜，程序功能的逐渐实现更令她们备受鼓舞，直到如今。\n\n“虚数”程序被送去研讨会测试。诚然，新生的“虚数”程序还有许多工作亟待完成，但其主体框架近乎完美地完成了。\n\n真理部日以继夜的奋战极大地推进了项目进度，但她们已经处于崩溃边缘。为了她们的身心健康，优香强令真理部停止任何开发工作，在得到充分休息前尽情享受假期。"
 MIL_event.4.a: "现在，立刻去休息。"

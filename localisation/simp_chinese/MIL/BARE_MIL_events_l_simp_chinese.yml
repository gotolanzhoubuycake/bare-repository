### 战后事件 ###
# 事件10：光辉的胜利
MIL_cae_war.10.t: "光辉的胜利"
MIL_cae_war.10.d: "在千年全体学生的不懈抗争之下，即使是强如凯撒，也无法动摇千年分毫，任何试图倾覆千年的邪恶想法都将被千年学生的抗争而粉碎。而具体到这场战争，我们为奋战在战斗一线的安保部成员和抵抗组织成员们的战果而骄傲，是他们在最前方抵挡了敌人的攻击，并以凌厉的反击摧毁了敌人的抵抗；为身处沦陷区但毫不妥协坚持抗击侵略者的学生和自治区市民们感到自豪，他们虽被迫留在沦陷区，但是却没有因此气馁，反而从敌人内部对敌人造成了巨大了损失，为正面战线的胜利做出了不可磨灭的贡献；为在后勤战线上那些默默无闻却加班加点不求回报生产各种物资的学生们表示敬意,她们单个人的力量或许很小，小到不值一提，但是当这些点点滴滴汇聚到一起，却爆发出了所有人都意想不到的生产力，为前线提供了远超预期的供给，让奋战在前线的同窗们能够毫无后顾之忧，全力以赴击退敌人。而更重要的是，在每一个千年人的不懈努力之下，我们守护住了我们美丽的校园，我们没有让千年的旗帜因我们而蒙羞，欢呼吧，为团结在这面光辉旗帜之下抗击无耻资本的每一个人而欢庆胜利！让整个基沃托斯为我们的成就而欢呼！"
MIL_cae_war.10.a: "千年旗帜永不落！"

# 事件11：审判战犯
MIL_cae_war.11.t: "审判战犯"
MIL_cae_war.11.d: "战争已经结束，但正义的审判才刚刚开始。那些在战争中犯下罪行的凯撒集团成员必须为他们的所作所为付出代价，千年将组织公开审判，让所有人都看到，任何胆敢侵犯千年的人都不会逃脱应有的惩罚。"
MIL_cae_war.11.a: "正义不会缺席"

# 事件12：凯撒集团大解体
MIL_cae_war.12.t: "凯撒集团大解体"
MIL_cae_war.12.d: "凯撒集团，一个在基沃托斯足以称得上无处不在的庞然大物，即使是会长尚在时的联邦学生会，也得对其礼让三分，在非常久的时间里，没人会想到，这样一个巨无霸企业会有遭受崩溃的一天。然而，让所有人都没想到的是，这一天来的如此之快。入侵千年的失败，令凯撒集团遭受了前所未有的巨大损失，现任理事会直接陷入了崩溃状态。而此刻唯一能稳定局面的凯撒总裁在千年安保部攻入凯撒总部之后试图逃跑，但是其却只穿着睡衣在凯撒总部花园的假山中被安保部成员捉拿归案，千年学院随即宣布接管该地区的管理工作，并与诸多凯撒子公司展开了谈判，很显然，面对经济军事上的双重失败，凯撒集团已经输光了自己可用的全部筹码，面对一盘散沙且刚刚遭受重创的凯撒子公司们，千年学院研讨会在谈判中大获全胜，几乎达成了预定的所有目标，双方在残破的凯撒总部大楼前签订了停战协定，根据协定的要求，凯撒集团将被肢解，而研讨会会主导这一过程，千年安保部则会确保没有任何凯撒集团成员能够违反这一协定，并确保千年能够在这个过程中拿到自己应得的赔偿。\n\n即使是利维坦，也终有因自己过错而鲸落的一天。"
MIL_cae_war.12.a: "凯撒的时代结束了"
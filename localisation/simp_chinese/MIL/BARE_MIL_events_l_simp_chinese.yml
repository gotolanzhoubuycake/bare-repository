 MIL_event.5.t: "“虚数”大显身手"
 MIL_event.5.d: "得益于真理部的奉献，“虚数”系统的核心框架经过严格检验，其鲁棒性极其优秀，可用作扩展内容的预置接口也非常全面。按她们的话来说，再给她们一周时间，“虚数”系统便可投入运行。\n\n将项目文件及注释经由保密程序移交至经严格遴选的社团后，参与成员在实验性的系统扩展过程中也展现出令研讨会讶异的热情与全神贯注，以至于参与“虚数”系统研发本身成为了一种极具诱惑力的“奖励”——研讨会约定的学分与经济奖励反而成为了无足轻重的添头。计算机与软件开发相关的社团与学生甚至会因为无法参与研发而捶胸顿足。\n\n历经许多挫折和热情洋溢的头脑风暴之后，经过严格检验并通过测试的试行版“虚数”系统正式推出。虽然其本身在全面接入千年管理体系的过程中仍然暴露出许多问题与功能上的欠缺，但“虚数”系统精确无匹的整体演算与微秒级分布式运算能力不但能以极高效率汇总分类各个问题并提供解决方案，在逐步完善的过程中甚至还涌现出令人着迷的深度卷积神经网络学习能力，使得“虚数”系统可以通过在具体使用场景中累积的“经验”，依照开发者的反馈对自身进行优化，并生成提示日志供开发者研判。\n\n研讨会及所有参加过研发工作的社团成员均对“虚数”系统的未来抱有极高期待。假以时日，待其在日常工作与生活的检验下逐步迭代，这个承载着整个千年期盼与爱的孩子将成为千年有史以来最强大、最值得信赖的伙伴。"
 MIL_event.5.a: "“虚数”系统的未来值得期待。"

 MIL_award_game.7.t: "玩家反馈"
 MIL_award_game.7.d: "试玩版本放出后，游戏开发部收到了大量反馈。评价并不总是温和，但这些意见确实能帮助她们把新作打磨得更接近玩家期待。"
 MIL_award_game.7.a: "把这些意见整理成清单"
 MIL_award_game.9.t: "千年大赏"
 MIL_award_game.9.d: "第二轮新作获得了远超预期的欢迎。游戏开发部终于用成果证明了自身价值，千年大赏也迎来了一项足以写入年度记录的作品。"
 MIL_award_game.9.a: "让开发继续下去"
 MIL_award_game.10.t: "游戏开发部的新作取得了傲人的成绩！"
 MIL_award_game.10.d: "评选结果出炉！我们的新作成功斩获“千年社团大赛”奖项！游戏社区下载量惊人，不仅登顶热门榜单，更在基沃托斯内引发了热烈讨论。游戏试玩展区前的玩家已经排起长龙！"
 MIL_award_game.10.a: "大家一起来打游戏吧！"
 MIL_award_game.11.t: "游戏开发部的新作顺利发布，口碑稳中有升！"
 MIL_award_game.11.d: "游戏开发部的新作顺利发布在游戏社区中，忠实粉丝们为期待已久的新作欢呼雀跃，相关话题持续占据学院论坛热搜榜。尽管部分玩家提出改进建议，但整体评价仍维持在四分之三好评率以上。"
 MIL_award_game.11.a: "来一起打游戏庆祝一下吧。"
 MIL_award_game.12.t: "游戏开发部的新作反响平平。"
 MIL_award_game.12.d: "游戏开发部的新作在游戏社区不温不火。尽管核心玩家群体给出了“充满诚意”的正面评价，但普通玩家的负面反馈占据主流。不过，粉丝们热忱的改进建议和对“游戏情怀”的肯定，仍让我们看到了希望。"
 MIL_award_game.12.a: "事已至此先打游戏吧~"


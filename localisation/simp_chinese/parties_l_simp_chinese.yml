#################
#政治冷感
#################
 no_ideology: "沉默多数"
 no_ideology_desc: "沉默多数"
 no_ideology_noun: "沉默多数"

 no_ideology_type: "象牙塔"
 no_ideology_type_desc: "§C象牙塔§!\n--------------\n尽管许多行政组织都将改善生活质量作为她们行为的目的，但相当一部分人并不关心实现的过程，而只关心最终结果。相比起领导们的动作与变动，他们往往对可爱小动物的视频更感兴趣。她们或许会关心时政新闻并对其拥有观点，但这往往只是她们的茶余谈资，而相对于改变周围的环境，她们更加关心自己的工资或者考试成绩。\n\n一般而言，基沃托斯中的多数学生与市民都可被划分为这一群体。但随着基沃托斯局势的变化，或重大事件的发生，这些人也会逐渐形成自己的观点，并最终因为自己的行事方式被归类到某个群体。一言以蔽之，他们即是“沉默的大多数”。\n--------------\n§Y“遗憾的是，你不能阻止祂对你产生兴趣。”§!"

#################
#进步哲学
#################
 Progressivism_ideology: "进步哲学"
 Progressivism_ideology_desc: "进步哲学"
 Progressivism_ideology_noun: "进步哲学"

 PGM_default_type: "进步哲学"
 PGM_default_type_desc: "§C进步哲学§!\n--------------\n作为学园都市，知识流动的地方，基沃托斯从来不缺乏新思想，新观点，以及她们的追随者。\n\n这些行政组织的执政方针旨在紧跟并追寻基沃托斯的新思想，在规则上实现与时俱进，以适应日新月异的基沃托斯。她们认为，唯有这样，才能实现自己所追求的学园理想。\n--------------\n§Y“变革是这个时代的正义。”§!"

 PGM_TRI_Nagisa_type: "圣三一改良方案"
 PGM_TRI_Nagisa_type_desc: "§C圣三一改良方案§!\n--------------\n圣三一改良方案代表着圣三一学园的领导者们对于改革的思考。其支持者们认为，圣三一长久以来的派系斗争和身份歧视必须得到改变，但与此同时，也必须确保圣三一政治格局的稳定。因此，该模式追求在现有的茶话会框架下实施进步措施，以期在不造成混乱的情况下，完成对既有规则的改革。\n\n尽管如此，该模式仍经受考验：温和的改革势必缺乏核心推动力，若要达成目的，桐藤渚和她的支持者们必须寻求更多政治上的盟友。\n--------------\n§Y“崭新航线，但要平稳航行。”§!\n\n§C权力机关：§!茶话会\n--------------\n茶话会是缔造圣三一的『第一次公会议』所确立的权力机构。它由最具影响力的三个派系，§G菲利乌斯§!、§R帕特尔§!以及§Y圣库斯特§!组成。因此，茶话会所作出的决定，即代表三个派系所共同做出的决定，在这一基础上，几乎鲜有政治力量，能够违抗茶话会的意志。\n根据茶话会的制度，茶话会的首席，由三个派系的领袖轮流出任。"
 PGM_MIL_SEM_type: "研讨会技官制度"
 PGM_MIL_SEM_type_desc: "§C研讨会技官制度§!\n--------------\n相对于其他学园在管理权上的腥风血雨，千禧科技学园在这方面显得异常平静。作为一个以技术，学识先行的学园，能者先得，便是进入管理层最有说服力的标准。只要你有能力和想法，你就有机会进入研讨会，为学园的发展各司其职。\n作为管辖范围相对宽泛的学生会，研讨会掌握了几乎所有的行政管理，财政大权，以及保护学园安宁的武装。让它有了强大的执行力。\n虽然研讨会本身也有一定的规章制度和程序来确保决策的原则性，但研讨会的会长往往就是原则本身-在她的拍板下，任何决定都能迅速成为共识，而“全知”的威望和能力也确保了她决策的权威性和执行力度。\n尽管这样决策的方式确实十分高效，但如果“全知”犯错了呢？\n--------------\n§Y“科学，智慧，未来”§!"
#################
#平等哲学
#################
 Egalitarianism_ideology: "平等哲学"
 Egalitarianism_ideology_noun: "平等哲学"
 Egalitarianism_ideology_desc: "平等哲学"

 ELM_default_type: "平等哲学"
 ELM_default_type_desc: "§C平等哲学§!\n--------------\n在包罗万象的基沃托斯，“生而平等”是相当一部分基沃托斯居民的共识，毕竟脑袋长角的学生和背上长翅膀的学生在机器人居民的咖啡厅里享受甜品是相当司空见惯的事。自然而然的，“平等”，就变成了许多执政方针中吸引人的地方。\n\n无论是“通过分配方式确保每个人得到相同资源”达成的“资源平等”还是“认为所有人的天赋与能力并不相同，确保所有人的机会平等才能实现社会平等”达成的“机会平等”，各种各样的方针都有着自己的受众，而“平等”定义本身也总是百花齐放。。\n--------------\n§Y“公平绝非口号。”§!"

 ELM_ALF_Leader_type: "阿里乌斯民主制度"
 ELM_ALF_Leader_type_desc: "阿里乌斯式民主制度\n------------\n流亡者们中受到广泛认同的平等哲学造就了一种特殊的民主制度。平等哲学是一种，无论人们的出身如何，样貌如何，均认为其在道德地位与个人价值上生来平等的哲学思想。\n\n但是，流亡者并不追求广泛意义上的直接“平等”。在流亡者们看来，所有人并非有着相同的能力，必须认识到个体间的能力差距。为了同“夫人”进行斗争，并争取最终的胜利，流亡者创造了一种以纪律为基础的民主模式。它首先尊重所有人的意见，特别是少数人的意见，并要求制定策略时积极询问下级成员的意见；但是，它也要求所有的成员遵守少数服从多数，以及集体组织领导的原则，并积极完成个人分工的内容。\n\n流亡者的远见卓识使得她们不像困顿于“夫人”牢笼中的同胞那样执着于仇恨，但流亡者们也承认，圣三一对阿里乌斯所做的一切，也并非“平等与和解”这种词汇就能揭过的……\n------------\n§Y“自由地沐浴阳光，是阿里乌斯人与生俱来的权力。”§!"

#################
#专制哲学
#################
 Authoritarian_ideology: "专制哲学"
 Authoritarian_ideology_noun: "专制哲学"
 Authoritarian_ideology_desc: "专制哲学"
 
 ATN_default_type: "集权体制"

 ATN_TRI_Hawk_type: "圣三一强硬路线"
 ATN_TRI_Hawk_type_desc: "§Y圣三一强硬路线§!\n--------------\n圣三一发祥于诸多派系的联合——尽管如此，“实力至上”一直是一股不容忽略的声音：掌握力量的派系理应主政圣三一学园，这是自然之理。\n\n所谓的圣三一强硬路线正是诞生于这种尚武的氛围中，并在在帕特尔分派和正义实现委员会的部分成员中受到支持。围绕着某些个人能力强大的学生，这些崇尚个人英武的成员自发地形成了一个支持强硬路线的团体，而这种联结又在“同僚情谊”的影响下反过来得到强化。这使得她们的观点显得有些偏激——“唯有将一切敌对者以绝对的实力征服才能获得真正意义上的团结与未来。”\n\n无论这种政见正确与否，其经由战斗纪律所确立的秩序与共识可称得上极端顽固。这使得她们的观点即便遭受挑战也极难改变。她们的确尊崇强者，但即便是这位“精神领袖”，也必须和她们保持步调一致的共识。随着环境日趋紧张，她们的声势与影响力也在渐渐提升。\n--------------\n§Y“我行我心澄如明镜，做所作为皆为正义。”§!"

 ATN_deep_state_type: "阴谋集团"
 ATN_deep_state_type_desc: "§Y深层机关§!\n--------------\n在基沃托斯的互联网上，总是流传着这样的传说：即各个学园的行政机关只是其微不足道的门面，而真正的学园统治者，是那些深藏于阴影之中的神秘集团。\n\n大多数时候，“阴谋集团”只是被当成互联网上的一则笑谈，只有那些最离经叛道的成员，才会惊恐的发现，它的存在并非虚妄。\n\n§Y深层机关§!的核心成员总是有相同的保守认知。在这些真正的权力主宰眼中，基沃托斯的成员皆为羊羔，而她们，是唯一有权代主牧民的受选者——至于那些明面上的行政结构，只不过是在她们成就大业之前无关紧要的遮掩而已。\n--------------\n§R“世人皆愚。”§!"
 
 ATN_GEH_Tyrant_Follower_type: "阴谋集团"
 ATN_GEH_Tyrant_Follower_type_desc: "§Y雷帝之影§!\n--------------\n若问起格黑娜最糟糕的时期，那么十个中有八个人，会回答的是雷帝的时代；但若是问格黑娜最强大的时代，十个人中有十个，都会回答是雷帝的时代。\n\n雷帝的执政对格黑娜今日的面貌影响深远。其统治以铁腕与秩序著称，在这一期间，格黑娜几乎成为了基沃托斯最有影响力的学院，即便圣三一也只能暂避锋芒。然而，随着雷帝的离开，格黑娜的秩序也随之崩溃，只剩余一片名为自由的混乱。\n\n对一些怀念着那个时代的格黑娜成员来说，雷帝对于格黑娜如今的失败，负有不可饶恕的责任。现在，这些野心家已经走上台前，她们决心抹除雷帝所犯下的错误，重新恢复格黑娜的旧日荣光。\n--------------\n§R“Peace through Power！”§!"


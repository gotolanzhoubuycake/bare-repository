 CEN.6666.t: "第一课"
 CEN.6666.desc: "夏莱的地下室里，还残留着些许的硝烟味。\n\n凛打量了一下周围，目光又落到了面前之人——老师——手中的物品上。\n\n那是只能由老师才能启动的“什亭之匣”，但在会长失踪后，偏偏又只有这个匣子，才拥有控制圣所之塔的权限。\n\n这正是她先斩后奏，将老师带到这里的目的：虽然她现在只是个代理——或者连代理都不是，但只要能拿回联邦学生会对圣所之塔的权限，取得行政委员会的事后确认自然是板上钉钉的事。\n\n只要，面前的人完成权限的移交——\n\n“必须要这样才能恢复圣所之塔的权限吗？”\n\n面前的人忽然问到。\n\n凛刚想要回答，却愣住了。她的计划似乎有所疏漏，而漏洞正在面前这个人身上。显而易见，只要对方不交还权限，那么她的一切计划就都会落空……不，也许比那更糟糕，因为对方只是外面来的陌生人：这是凛忽视对方、从一开始就打算收回权限的理由，现在却反过来成了她的阿喀琉斯之踵。\n\n凛只能紧张地注视着对方的神色，期待着老师没能发现这个致命漏洞。\n\n幸运的是，老师只是笑了笑，说道："
 CEN.6666.a: "“首先，我不会拿学生的东西……”"
 CEN.6666.b: "“……其次，我更喜欢真诚的学生。”"

 CEN.15.t: "责任与野心"
 CEN.15.desc: "窗外的月光格外明亮。\n\n随着阴云一同散去的，还有终于告一段落的混乱。\n\n那真是惊心动魄的几天，几乎所有人都觉得，联邦学生会要垮掉了。以至于直到现在，学生会的大家最爱说的依旧是那几个字组成的词：尘埃落定。\n\n还好那些事都没有发生。到处打砸抢烧的头盔团被清理干净，流通武器的黑市也都被取缔，摇摇欲坠的基础设施都得到了妥善的维护，一切好像都回到了原点：那个联邦学生会长还没走的时候。\n\n……可惜，一切并非如此。学生会长消失了，于是凛不得不担起重任。有时候她自己也会对此感到疑惑：她这么做，究竟是出于强大的责任心，还是为了满足自己那庞大的野心呢？\n\n凛不知道，但此时此刻，空闲下来的她终于有机会思考这件事。\n\n是了，现在行政委员会不可能反对她担任会长代理的提案，说不定还会做出“劝进”的行动。只要她愿意，她甚至可以拿去代理的头衔成为真正学生会长——只要那样，她就可以尽情挥洒自己的笔墨，就像是自己的小小野心所梦想的那样，成为超越前任会长的伟人。\n\n可果真如此的话，这股愧疚又是从何而来？\n\n“我更喜欢真诚的学生。”\n\n她又想起来那次短暂地会面中，老师留下的话语……责任也好、野心也罢，能匹配能力，便是向好的，反之，那就是一场灾难。\n\n“结果，那一次我被轻易看穿了。”\n\n于是，凛流出了眼泪，却又是笑着的。她明白自己该做什么选择，因为她已经知晓了自己的本心："
 CEN.15.a: "“我有责任必须履行。”"
 CEN.15.b: "“我的确不是最好的那个。”"
 Rins_presidency: "开始§Y七神凛§!的任期。"
 Kayas_presidency: "开始§Y不知火花耶§!的任期……？"

 CEN_sp_doc.18.t: "EI-018 | Kaiser Corporation"
 CEN_sp_doc.18.desc: "对象：EI-018 凯撒集团\n类型：军工复合体（OS/MI/RS）\n「这世界上就只有两种东西：有用的，或者废物。」\n\n=============\n\n关键事项：\n需对EI-018的任何活动保持密切关注，相关事务由总务室向O.T.S.I直接下达。\n这包括下述内容（等级由高到低）：\n - EI-018从外界带入的物质\n - EI-018进行的挖掘活动\n - EI-018关联的军事活动\n - EI-018的金融/商业活动\n——O.T.S.I\n\n=============\n\nEI-018，又称凯撒集团，是来自基沃托斯之外的军工复合体企业。该集团下辖有章鱼银行、凯撒PMC、凯撒26、凯撒工业、凯撒建设，脑脑食品数个子公司（机构）。调查显示，EI-018掌握有诸多外界技术，且对基沃托斯的部分遗迹（更正：古代遗产）具有出乎意料的好奇心。\n\nO.T.S.I分析认为，EI-018-2，即凯撒PMC，是一支高度职业化的军事组织。其军官及骨干力量主要由接受外界军事训练的成员组成。S.R.T内部档案表明，该组织下辖有一支特种作战力量（S.O.F），尽管成员平均身体素质无法与S.R.T相当，但拥有远超S.R.T的技术装备。\n\n目前，尚不确定EI-018是否持有任何超出联邦法律规定的攻击性武器。对其商业活动的调查显示，EI-018-4，即凯撒工业，曾对「铀」产生兴趣。该项目可以确认与军事用途相关，但因某种技术原因，EI-018-4放弃对其的投资。相关开采设施后由格黑娜军工集团接手。\n\n=============\n“继续。还有，七！神！凛！，你*数据删除*不能越过我对O.T.S.I下达命令！”\n——不知火花耶（防卫室室长）"
 CEN_sp_doc.18.a: "签字：£CEN_signature_shiranui_kaya_event_picture"
 CEN_sp_doc_18_tt: "档案§Y「凯撒集团」§!已完成！"

 CEN_sp_doc.66.t: "AS-006 | Perorodzilla"
 CEN_sp_doc.66.desc: "对象：AS-006 佩洛洛鸡斯拉\n等级：Crucis（AG/EH/LC）\n「当一个抽象化的概念被赋予了生命，怪物就此诞生。」\n\n=============\n\n管理协议：\nAS-006必须被置于一个隔音、密闭，充满喧闹声音，且完全干燥的6x18m长方形空间中。空间中需充满灯光，以及支持灯光自行运作至少24小时的备用电源。若处于安静、黑暗、或任何液体造成的潮湿环境中，可能导致AS-006转变为高危胁的AS-006-1。一旦该情况发生，应当立即召唤站点武装部队，使用任何可能火力使AS-006-1重新回归安定状态。\n——O.T.S.I\n\n=============\n\nAS-006是一种未知来源的生物，其外形和大小与Momo系列中的佩洛洛玩偶一致（应特殊要求，具体外观系列已抹去）。处置记录表明，该对象来自深海区域，可以确认文明造物（灯光、机械、人声）对其有特殊的吸引力。技术部门认为，对象AS-006存在外域技术的改造痕迹，高概率具备武器用途。\n\n该对象可转变为被称为AS-006-1的形态。该形态拥有巨大的身躯，约60m高度，拥有远高于布娃娃的身体强度，可以释放毁灭性的高能激光。AS-006-1可以召唤被称为AS-006-2的小型生物。该生物约2.5m高，外观与AS-006相同，具备攻击性。棘手的是，无法确认AS-006-2是如何出现的。\n\nAS-006-1从深海中出现，并于钟崎港登陆。在与瓦尔基里交战后10分钟后，由随后赶到的O.T.S.I小组处置。交战记录显示，能量武器对AS-006-1和AS-006-2的打击效果显著高于化学能或动能武器。\n\n=============\n“我可以认为是有人扔进海里的玩偶变成了怪物吗？那这个故事也太友尽了。”\n——五十岚夜见（O.T.S.I主管）"
 CEN_sp_doc.66.a: "签字：£CEN_signature_Igarashi_Yomi_event_picture"
 CEN_sp_doc_66_tt: "档案§Y「佩洛洛鸡斯拉」§!已完成！"


 CEN_sp_doc.101.t: "迷途"
 CEN_sp_doc.101.desc: "五十岚夜见第一次在这间“战略情报室”之中走神。她已经被海一样的文件淹没了一个星期，在一杯又一杯咖啡之间，依然是处理不完的混乱。\n\n尽管如此，在她得到领导O.T.S.I的任命之时，就已经对如今的状况有所预料。\n\n这当然是个烫手山芋——在O.T.S.I成立的那天，学生会的干部们沿着庞大的会议桌坐了一整圈。除了笑眯眯的防卫室长，每个人都对台上的她致以充满深意的审视。\n\n归根结底，联邦学生会长虽然已不知所踪，但她的威严仍徘徊在这座高塔之中。这或许能解释为什么学生会执拗地想要用O.T.S.I取代S.R.T，显然，这就像是开窗通风：浊气散尽，新鲜空气也就该进来了。\n\n所以，领导O.T.S.I当然是一件困难重重的差事。学生会的确不想要下一个S.R.T了，这也就意味着，今年的预算，不会有哪怕1%分给这个新诞生的强力部门。正所谓巧妇难为无米之炊，想胜任这个位置，不光要踏实肯干，还得长袖善舞。\n\n总而言之，不适合一位做题家……\n……大概吧。\n\n夜见沉默了一会，又抬起笔，恢复了工作时的姿态。"
 CEN_sp_doc.101.a: "签字：£CEN_signature_Igarashi_Yomi_event_picture"
 CEN_sp_doc_101_tt: "§R做好面对未知之事的准备……§!"
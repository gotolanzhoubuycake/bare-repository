 CEN_bp_mid_desc_tt:"--------------\n§O联邦议会§!与§C行政委员会§!的矛盾在联邦学生会之中并非秘密。联邦学生会长的失踪后，这一矛盾如今已愈发尖锐。\n\n显而易见，投票解散§YS.R.T特殊学园§!只是一个开始。随着强人政治的结束，§C行政委员会§!的立场正变得愈加微妙。\n\n§Y好戏开场。§!"
